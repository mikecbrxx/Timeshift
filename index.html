window.syncAllUsers = async () => {
  if (!db) { showToast('db is null — not connected'); return; }
  if (!fbSetDoc || !fbDoc) { showToast('Firebase functions not ready'); return; }
  const active = state.users.filter(u => u.active);
  showToast(`Syncing ${active.length} users…`);
  let ok = 0;
  for (const user of active) {
    try {
      // Strip any undefined values which Firestore rejects
      const clean = JSON.parse(JSON.stringify(user));
      await fbSetDoc(fbDoc(db, 'users', clean.id), clean);
      ok++;
    } catch(e) {
      state.fbStatus = `Sync failed on ${user.name}: ${e.message}`;
      showToast(`Failed: ${e.message}`);
      render();
      return;
    }
  }
  state.fbStatus = `Synced ${ok} of ${active.length} users to Firestore ✓`;
  showToast(`${ok} users synced to Firebase ✓`);
  render();
};

window.saveRate = async (userId) => {
  const from   = document.getElementById('rate-from').value;
  const to     = document.getElementById('rate-to').value;
  const amount = parseFloat(document.getElementById('rate-amount').value);
  const note   = document.getElementById('rate-note').value.trim();
  const errEl  = document.getElementById('rate-error');

  const user = state.users.find(u => u.id === userId);
  if (!user) return;
  if (!user.rates) user.rates = [];

  const newRate = { id: uid(), from_date: from, to_date: to, hourly_rate: amount, note };
  const err = validateRate(newRate, user.rates, null);
  if (err) { errEl.textContent = err; return; }

  user.rates.push(newRate);
  user.rates.sort((a,b) => a.from_date.localeCompare(b.from_date));

  // Save to Firestore
  if (!DEMO_MODE && db) {
    try { await fbSetDoc(fbDoc(db, 'users', userId), user); }
    catch(e) { errEl.textContent = 'Save failed: ' + e.message; user.rates.pop(); return; }
  }
  auditLog('RATE_ADD', `Rate added for ${user.name}: £${amount}/hr from ${from} to ${to}`);
  showToast('Rate added');
  state.modal = 'rates'; // re-open rates modal
  render();
};

window.updateRate = async (userId, idx) => {
  const from   = document.getElementById('edit-rate-from').value;
  const to     = document.getElementById('edit-rate-to').value;
  const amount = parseFloat(document.getElementById('edit-rate-amount').value);
  const note   = document.getElementById('edit-rate-note').value.trim();
  const errEl  = document.getElementById('edit-rate-error');

  const user = state.users.find(u => u.id === userId);
  if (!user || !user.rates || !user.rates[idx]) return;

  const updatedRate = { ...user.rates[idx], from_date: from, to_date: to, hourly_rate: amount, note };
  const err = validateRate(updatedRate, user.rates, updatedRate.id);
  if (err) { errEl.textContent = err; return; }

  const before = { ...user.rates[idx] };
  user.rates[idx] = updatedRate;
  user.rates.sort((a,b) => a.from_date.localeCompare(b.from_date));

  if (!DEMO_MODE && db) {
    try { await fbSetDoc(fbDoc(db, 'users', userId), user); }
    catch(e) { errEl.textContent = 'Save failed: ' + e.message; user.rates[idx] = before; return; }
  }
  auditLog('RATE_EDIT', `Rate updated for ${user.name}: £${amount}/hr from ${from} to ${to}`, before, updatedRate);
  showToast('Rate updated');
  state.modal = 'rates';
  render();
};

    catch(e) { showToast('Delete failed: ' + e.message); user.rates.splice(idx, 0, removed); return; }
  }
  auditLog('RATE_DELETE', `Rate deleted for ${user.name}: £${removed.hourly_rate}/hr from ${removed.from_date}`);

window.saveUser = async (id) => {
  const name = document.getElementById('u-name').value.trim();
  const role = document.getElementById('u-role').value;
  const phone = document.getElementById('u-phone').value.trim();
  const email = document.getElementById('u-email').value.trim();
  const address = document.getElementById('u-address').value.trim();
  const city = document.getElementById('u-city').value.trim();
  const postcode = document.getElementById('u-postcode').value.trim().toUpperCase();

  if (!name) { showToast('Name is required'); return; }

  const colors = ['#FF6B8A','#7C5CBF','#00B4C5','#FFB347','#52C97E','#E84D6F','#5E3FA3'];

  if (id) {
    const idx = state.users.findIndex(u => u.id === id);
    if (idx >= 0) {
      const updated = { ...state.users[idx], name, role, phone, email, address, city, postcode,
        initials: name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2) };
      state.users[idx] = updated;
      if (!DEMO_MODE && db) {
        try {
          await fbSetDoc(fbDoc(db, 'users', id), updated);
          console.log('User updated in Firestore:', id);
        } catch(e) { console.error('User update failed:', e); showToast('Save failed: ' + e.message); return; }
      }
      auditLog('USER_EDIT', `User updated: ${name}`);
    }
    showToast('User updated');
  } else {
    const pinEl = document.getElementById('u-pin');
    const pin = pinEl ? pinEl.value : '0000';
    if (pin.length !== 4 || !/^\d{4}$/.test(pin)) { showToast('PIN must be 4 digits'); return; }
    if (state.users.find(u => u.pin === pin && u.active)) { showToast('Invalid PIN — please choose another'); return; }
    const newId = 'u' + Date.now();
    const newUser = {
      id: newId, name, role, pin, phone, email, address, city, postcode,
      initials: name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2),
      color: colors[state.users.length % colors.length],
      hourly_rate: null, active: true
    };
    state.users.push(newUser);
    if (!DEMO_MODE && db) {
      try {
        await fbSetDoc(fbDoc(db, 'users', newId), newUser);
        console.log('New user saved to Firestore:', newId);
      } catch(e) { console.error('User save failed:', e); showToast('Save failed: ' + e.message); return; }
    }

    showToast('User added');

window.doChangePin = async () => {
  const old = document.getElementById('pin-old').value;
  const newPin = document.getElementById('pin-new').value;
  const confirm2 = document.getElementById('pin-confirm').value;
  const errEl = document.getElementById('pin-change-error');

  if (old !== state.currentUser.pin) { errEl.textContent = 'Current PIN is incorrect'; return; }
  if (!/^\d{4}$/.test(newPin)) { errEl.textContent = 'New PIN must be 4 digits'; return; }
  if (newPin !== confirm2) { errEl.textContent = 'PINs do not match'; return; }
  if (state.users.find(u => u.id !== state.currentUser.id && u.pin === newPin)) {
    errEl.textContent = 'Invalid PIN — please choose another'; return;
  }
  const idx = state.users.findIndex(u => u.id === state.currentUser.id);
  if (idx >= 0) {
    state.users[idx].pin = newPin;
    state.currentUser.pin = newPin;
    if (!DEMO_MODE && db) {
      try {
        await fbUpdateDoc(fbDoc(db, 'users', state.currentUser.id), { pin: newPin });
        console.log('PIN changed in Firestore:', state.currentUser.id);
      } catch(e) { console.error('PIN change failed:', e); showToast('Save failed: ' + e.message); return; }
    }
    auditLog('PIN_CHANGE', 'User changed their own PIN');
  }
  showToast('PIN changed successfully');
  closeModal();
};

window.exportPDF = (type) => {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const u = state.currentUser;
  const now = new Date();
  const m = state.reportMonth, y = state.reportYear;

  let title = '', entries = [];
  if (type === 'week') {
    const week = getWeekBounds(now);
    title = `Week: ${week.start.toLocaleDateString('en-GB')} – ${week.end.toLocaleDateString('en-GB')}`;
    entries = state.entries.filter(e => {
      if (e.user_id !== u.id) return false;
      const d = parseDate(e.date);
      return d >= week.start && d <= week.end;
    }).sort((a,b)=>a.date.localeCompare(b.date));
  } else if (type === 'month') {
    title = `${MONTH_NAMES[m]} ${y}`;
    entries = state.entries.filter(e => {
      if (e.user_id !== u.id) return false;
      const d = parseDate(e.date);
      return d.getMonth() === m && d.getFullYear() === y;
    }).sort((a,b)=>a.date.localeCompare(b.date));
  } else {
    title = `Year ${y}`;
    entries = state.entries.filter(e => e.user_id === u.id && parseDate(e.date).getFullYear() === y)
      .sort((a,b)=>a.date.localeCompare(b.date));
  }

  const total = sumMins(entries);
  const ep = calcPeriodEarnings(entries, u);

  // Header
  doc.setFillColor(124, 92, 191);
  doc.rect(0, 0, 210, 22, 'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(14); doc.setFont('helvetica','bold');
  doc.text('TimeShift', 14, 10);
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.text(`${title} · ${u.name} · Generated ${now.toLocaleDateString('en-GB')}`, 14, 18);
  doc.setTextColor(0,0,0);

  // Summary block
  doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(`Total Hours: ${formatMins(total)}`, 14, 32);
  if (ep.hasRates) {
    doc.setTextColor(27,122,66);
    doc.text(`Earnings: ${fmtCurrency(ep.total)}${ep.unrated > 0 ? ` (${ep.unrated} day${ep.unrated!==1?'s':''} unrated)` : ''}`, 14, 39);
    doc.setTextColor(0,0,0);
  }
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.text(`${entries.length} days worked`, 14, ep.hasRates ? 46 : 39);

  const hasEarnings = ep.hasRates;
  doc.autoTable({
    startY: hasEarnings ? 52 : 45,
    head: [['Date','Shift 1','Shift 2','Shift 3','Hours', ...(hasEarnings ? ['Earnings'] : []),'Note']],
    body: entries.map(e => {
      const rate = getRateForDate(u, e.date);
      const earn = rate ? fmtCurrency(calcEarnings(e.total_mins, rate)) : '—';
      return [
        displayDate(e.date),
        e.shifts[0] ? `${e.shifts[0].start}–${e.shifts[0].end}` : '',
        e.shifts[1] ? `${e.shifts[1].start}–${e.shifts[1].end}` : '',
        e.shifts[2] ? `${e.shifts[2].start}–${e.shifts[2].end}` : '',
        formatMins(e.total_mins),
        ...(hasEarnings ? [earn] : []),
        e.note || ''
      ];
    }),
    headStyles: { fillColor:[255,107,138], textColor:255, fontStyle:'bold', fontSize:8 },
    alternateRowStyles: { fillColor:[253,245,255] },
    styles: { fontSize:8 },
    columnStyles: hasEarnings ? { 5:{textColor:[27,122,66],fontStyle:'bold'} } : {}
  });

  doc.save(`TimeShift_${u.name.replace(/\s+/g,'_')}_${title.replace(/\s+/g,'_')}.pdf`);
  auditLog('PDF_EXPORT', `${type} PDF: ${u.name} · ${title}`);
  showToast('PDF exported');
};

window.exportAdminPDF = () => {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
  const m = state.adminReportMonth, y = state.adminReportYear;
  const tab = state.adminReportTab || 'month';
  const now = new Date();
  const week = getWeekBounds(now);
  const allActive = state.users.filter(u => u.active);
  const sel = state.adminSelectedUsers.length > 0 ? state.adminSelectedUsers : allActive.map(u => u.id);
  const usersToShow = allActive.filter(u => sel.includes(u.id));
  const period = tab === 'week'
    ? `Week ${week.start.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}–${week.end.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}`
    : tab === 'month' ? `${MONTH_NAMES[m]} ${y}` : `Year ${y}`;

  doc.setFillColor(124,92,191);
  doc.rect(0,0,210,22,'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(14); doc.setFont('helvetica','bold');
  doc.text('TimeShift — Staff Report', 14, 10);
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.text(`${period} · ${usersToShow.length} staff · Generated ${now.toLocaleDateString('en-GB')}`, 14, 18);
  doc.setTextColor(0,0,0);

  let startY = 28;
  let grandHours = 0, grandEarnings = 0, anyEarnings = false;

  usersToShow.forEach(u => {
    let ue;
    if (tab === 'week') {
      ue = state.entries.filter(e => {
        if (e.user_id !== u.id) return false;
        const d = parseDate(e.date);
        return d >= week.start && d <= week.end;
      });
    } else if (tab === 'month') {
      ue = state.entries.filter(e => {
        if (e.user_id !== u.id) return false;
        const d = parseDate(e.date);
        return d.getMonth() === m && d.getFullYear() === y;
      });
    } else {
      ue = state.entries.filter(e => e.user_id === u.id && parseDate(e.date).getFullYear() === y);
    }
    ue.sort((a,b) => a.date.localeCompare(b.date));

    const total = sumMins(ue);
    grandHours += total;
    const ep = calcPeriodEarnings(ue, u);
    if (ep.hasRates) { anyEarnings = true; grandEarnings += ep.total; }

    if (startY > 240) { doc.addPage(); startY = 16; }

    doc.setFontSize(10); doc.setFont('helvetica','bold');
    doc.setTextColor(124,92,191);
    const earnStr = ep.hasRates ? `  ·  ${fmtCurrency(ep.total)}` : '';
    doc.text(`${u.name}  —  ${formatMins(total)}${earnStr}  (${ue.length} day${ue.length!==1?'s':''})`, 14, startY);
    doc.setTextColor(0,0,0);
    startY += 3;

    if (ue.length) {
      const hasE = ep.hasRates;
      doc.autoTable({
        startY,
        head: [['Date','Shift 1','Shift 2','Shift 3','Hours', ...(hasE?['Earnings']:[]),'Note']],
        body: ue.map(e => {
          const rate = getRateForDate(u, e.date);
          const earn = rate ? fmtCurrency(calcEarnings(e.total_mins, rate)) : '—';
          return [
            displayDate(e.date),
            e.shifts[0]?`${e.shifts[0].start}–${e.shifts[0].end}`:'',
            e.shifts[1]?`${e.shifts[1].start}–${e.shifts[1].end}`:'',
            e.shifts[2]?`${e.shifts[2].start}–${e.shifts[2].end}`:'',
            formatMins(e.total_mins),
            ...(hasE?[earn]:[]),
            e.note||''
          ];
        }),
        headStyles:{fillColor:[255,107,138],textColor:255,fontSize:7},
        alternateRowStyles:{fillColor:[253,245,255]},
        styles:{fontSize:7,cellPadding:2},
        columnStyles: hasE ? { 5:{textColor:[27,122,66],fontStyle:'bold'} } : {},
        margin:{left:14,right:14}
      });
      startY = doc.lastAutoTable.finalY + 8;
    } else {
      doc.setFontSize(8); doc.setTextColor(150,150,150);
      doc.text('No entries for this period', 18, startY+4);
      doc.setTextColor(0,0,0);
      startY += 10;
    }
  });

  // Grand totals footer
  if (startY > 260) { doc.addPage(); startY = 16; }
  doc.setFontSize(10); doc.setFont('helvetica','bold');
  doc.setTextColor(124,92,191);
  doc.text(`Combined Total: ${formatMins(grandHours)}${anyEarnings ? '  ·  ' + fmtCurrency(grandEarnings) : ''}`, 14, startY + 6);

  doc.save(`TimeShift_Staff_${period.replace(/[^a-zA-Z0-9]/g,'_')}.pdf`);
  auditLog('ADMIN_PDF_EXPORT', `Staff PDF: ${period} · ${usersToShow.length} staff`);
  showToast('PDF exported');
};

// ═══════════════════════════════════
// TOAST
// ═══════════════════════════════════
function showToast(msg) {
  state.toast = msg;
  render();
  setTimeout(() => { state.toast = null; render(); }, 2500);
}

// ═══════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════
function render() {
  const app = document.getElementById('app');

  // Offline blocker — always shown if offline (except on pin screen during first load)
  if (state.online === false) {
    app.innerHTML = `<div class="offline-screen">
      ${logoSVG(64)}
      <h2>No Connection</h2>
      <p>TimeShift requires an internet connection.<br/>Please check your connection and try again.</p>
      <button class="btn btn-primary" onclick="checkOnline()">${icons.refresh} Try Again</button>
    </div>`;
    return;
  }

  if (state.screen === 'pin') {
    app.innerHTML = renderPin();
    return;
  }

  let screenContent = '';
  switch (state.screen) {
    case 'home': screenContent = renderHome(); break;
    case 'log': screenContent = renderLog(); break;
    case 'entries': screenContent = renderEntries(); break;
    case 'reports': screenContent = renderReports(); break;
    case 'users': screenContent = renderUsers(); break;
    // admin-reports merged into reports screen
    case 'settings': screenContent = renderSettings(); break;
    case 'audit': screenContent = renderAudit(); break;
    case 'backup': screenContent = renderBackup(); break;
    case 'config': screenContent = renderConfig(); break;
    case 'admin-drill': screenContent = renderAdminDrill(); break;
    case 'freeze': screenContent = renderFreeze(); break;
    default: screenContent = renderHome();
  }

  app.innerHTML = `
    ${renderTopbar()}
    <div class="screen">${screenContent}</div>
    ${renderNav()}
    ${renderModal()}
    ${renderProfileMenu()}
    ${state.toast ? `<div class="toast">${state.toast}</div>` : ''}
  `;
  // Sync FAB and back button visibility after every render
  _tsUpdateFab(state.screen);
}

// ═══════════════════════════════════
// AUDIT
// ═══════════════════════════════════
function tsNow() { return new Date().toISOString(); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function auditLog(action, detail, before, after) {
  const entry = {
    id: uid(),
    ts: tsNow(),
    user: state.currentUser ? state.currentUser.name : 'system',
    role: state.currentUser ? state.currentUser.role : '',
    action,
    detail
  };
  if (before !== undefined) entry.before = before;
  if (after !== undefined) entry.after = after;
  state.auditLog.push(entry);
  // Write to Firestore asynchronously — fire and forget
  if (!DEMO_MODE && db && fbSetDoc && fbDoc) {
    fbSetDoc(fbDoc(db, 'audit', entry.id), entry).catch(e => console.error('Audit write failed:', e));
  }
}

// ═══════════════════════════════════
// FIREBASE CONFIG ACTIONS
// ═══════════════════════════════════
window.saveFirebaseConfig = async function() {
  const apiKey    = document.getElementById('fb-apikey').value.trim();
  const projectId = document.getElementById('fb-projectid').value.trim();
  const appId     = document.getElementById('fb-appid').value.trim();
  if (!apiKey || !projectId || !appId) { showToast('All three fields are required'); return; }
  const cfg = {
    apiKey,
    projectId,
    appId,
    authDomain: `${projectId}.firebaseapp.com`,
    storageBucket: `${projectId}.appspot.com`,
    messagingSenderId: '',
  };
  localStorage.setItem('ts_firebase', JSON.stringify(cfg));
  showToast('Saved — connecting to Firebase…');
  await initFirebase();
  if (!DEMO_MODE && db) {
    await loadFirebaseData();
    auditLog('CONFIG_SAVE', 'Firebase configuration saved and connected');
    showToast('Firebase connected ✓');
  } else {
    showToast('Connection failed — check keys and retry');
  }
  render();
};


window.clearFirebaseConfig = function() {
  if (!confirm('Clear override? App will revert to default hardcoded credentials.')) return;
  localStorage.removeItem('ts_firebase');
  showToast('Override cleared — using default credentials');
  render();
};

// Load all users and entries from Firestore into state
async function loadFirebaseData() {
  // Fetches live from Firebase — nothing stored locally.
  // Essential collections (users, entries) throw on failure — blocks startup.
  // Optional collections (audit, freezePeriods, settings) fail silently.
  if (!db) throw new Error('Firestore not initialised');

  // Step A — essential data (must succeed)
  const [uSnap, eSnap] = await Promise.all([
    fbGetDocs(fbCollection(db, 'users')),
    fbGetDocs(fbCollection(db, 'entries'))
  ]);
  state.users   = uSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(u => u.active !== false);
  state.entries = eSnap.docs.map(d => ({ id: d.id, ...d.data() }));

  // Step B — optional data (soft fail — don't block startup)
  try {
    const aSnap = await fbGetDocs(fbCollection(db, 'audit'));
    state.auditLog = aSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e) { console.warn('audit load skipped:', e.message); }

  try {
    const fpSnap = await fbGetDocs(fbCollection(db, 'freezePeriods'));
    state.freezePeriods = fpSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e) { console.warn('freezePeriods load skipped:', e.message); }

  try {
    const yeSnap = await fbGetDocs(fbCollection(db, 'settings'));
    const yeDoc = yeSnap.docs.find(d => d.id === 'yearEnd');
    if (yeDoc) state.yearEndSettings = yeDoc.data();
  } catch(e) { console.warn('settings load skipped:', e.message); }

  console.log('Loaded from Firebase:', state.users.length, 'users,', state.entries.length, 'entries');
}

// ═══════════════════════════════════
// YEAR END & FREEZE ACTIONS
// ═══════════════════════════════════
window.saveYearEndSettings = async function() {
  const day   = parseInt(document.getElementById('ye-day').value);
  const month = parseInt(document.getElementById('ye-month').value);
  if (!day || day < 1 || day > 31 || !month) { showToast('Invalid date'); return; }
  state.yearEndSettings = { day, month };
  // Persist to Firestore as a settings doc
  if (!DEMO_MODE && db) {
    try { await fbSetDoc(fbDoc(db, 'settings', 'yearEnd'), { day, month }); }
    catch(e) { showToast('Save failed: ' + e.message); return; }
  }
  auditLog('YEAR_END_SETTINGS', `Year end set to ${day}/${month}`);
  showToast('Year end date saved');
  render();
};

window.freezePeriod = async function(periodEnd) {
  if (!confirm(`Freeze earnings up to ${periodEnd}?

This calculates a permanent snapshot for all staff. You can unfreeze later to correct errors.`)) return;

  const activeUsers = state.users.filter(u => u.active);
  const snapshot = activeUsers.map(u => {
    const ue = state.entries.filter(e => e.user_id === u.id && e.date <= periodEnd);
    const totalMins = sumMins(ue);
    const ep = calcPeriodEarnings(ue, u);
    return {
      user_id: u.id,
      name: u.name,
      total_mins: totalMins,
      earnings: ep.hasRates ? ep.total : null,
      unrated_days: ep.unrated || 0
    };
  });

  const period = {
    id: uid(),
    period_end: periodEnd,
    frozen_at: tsNow(),
    frozen_by: state.currentUser.name,
    earnings_snapshot: snapshot,
    notes: '',
    overridden: false,
    override_reason: ''
  };

  state.freezePeriods.push(period);

  if (!DEMO_MODE && db) {
    try { await fbSetDoc(fbDoc(db, 'freezePeriods', period.id), period); }
    catch(e) {
      state.freezePeriods.pop();
      showToast('Freeze failed: ' + e.message); return;
    }
  }
  auditLog('PERIOD_FROZEN', `Period frozen: ${periodEnd} by ${state.currentUser.name}`);
  showToast(`Period ${periodEnd} frozen ✓`);
  render();
};

window.unfreezePeriod = async function(id) {
  const reason = prompt('Enter reason for unfreezing this period:\n(This will be recorded in the audit trail)');
  if (reason === null) return; // cancelled
  if (!reason.trim()) { showToast('A reason is required'); return; }

  const idx = state.freezePeriods.findIndex(p => p.id === id);
  if (idx < 0) return;

  state.freezePeriods[idx].overridden = true;
  state.freezePeriods[idx].override_reason = reason.trim();
  state.freezePeriods.splice(idx, 1);

  if (!DEMO_MODE && db) {
    try { await fbDeleteDoc(fbDoc(db, 'freezePeriods', id)); }
    catch(e) { showToast('Unfreeze failed: ' + e.message); return; }
  }
  auditLog('PERIOD_UNFROZEN', `Period unfrozen: reason — ${reason.trim()}`, null, { id });
  showToast('Period unfrozen — recalculate and refreeze when ready');
  render();
};

// ═══════════════════════════════════
// BACKUP & RESTORE
// ═══════════════════════════════════
window.exportBackup = async function() {
  const now = new Date();
  const pad = (n,w) => String(n).padStart(w,'0');
  const ts = pad(now.getFullYear(),4)+pad(now.getMonth()+1,2)+pad(now.getDate(),2)
           + '-'+pad(now.getHours(),2)+pad(now.getMinutes(),2)+pad(now.getSeconds(),2);
  const filename = `timeshift-backup-${ts}.json`;

  // Fetch ALL users from Firestore (including inactive) for complete backup
  let allUsers = state.users;
  if (!DEMO_MODE && db) {
    try {
      const uSnap = await fbGetDocs(fbCollection(db, 'users'));
      allUsers = uSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch(e) {
      console.warn('Could not fetch all users for backup:', e.message);
    }
  }

  const data = {
    version: APP_VERSION,
    exportedAt: now.toISOString(),
    users: allUsers,
    entries: state.entries,
    auditLog: state.auditLog,
    freezePeriods: state.freezePeriods,
    yearEndSettings: state.yearEndSettings,
    backupReminderDays: state.backupReminderDays,
    lastBackupDate: now.toISOString()
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}));
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
  state.lastBackupDate = now.toISOString();
  saveBackupPrefs();
  auditLog('BACKUP_EXPORT', `Backup exported: ${filename} — ${allUsers.length} users, ${state.entries.length} entries`);
  showToast('Backup exported ✓');
  render();
};

window.restoreBackup = async function() {
  const fi = document.getElementById('restore-file');
  if (!fi || !fi.files || !fi.files.length) { showToast('Please select a backup file first'); return; }

  // Validate file first
  let restored;
  try {
    const text = await fi.files[0].text();
    restored = JSON.parse(text);
  } catch(e) {
    showToast('Cannot read file — is it a valid JSON backup?'); return;
  }

  // Validate structure
  if (!restored.users || !Array.isArray(restored.users) ||
      !restored.entries || !Array.isArray(restored.entries)) {
    showToast('Invalid backup file — missing users or entries'); return;
  }

  const fileDate = restored.exportedAt
    ? new Date(restored.exportedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})
    : 'unknown date';

  const confirm1 = prompt(
    `RESTORE BACKUP\n\nFile: ${fi.files[0].name}\nCreated: ${fileDate}\nContains: ${restored.users.length} users, ${restored.entries.length} entries\n\nThis will OVERWRITE all current data in the app and Firestore.\n\nType CONFIRM to proceed:`
  );
  if (confirm1 !== 'CONFIRM') { showToast('Restore cancelled'); return; }

  const progressEl = document.getElementById('restore-progress');
  const btnEl = document.getElementById('restore-btn');
  const setProgress = (msg) => { if (progressEl) { progressEl.style.display=''; progressEl.textContent = msg; } };
  if (btnEl) btnEl.disabled = true;

  try {
    // Restore to state
    state.users    = restored.users    || [];
    state.entries  = restored.entries  || [];
    state.auditLog = restored.auditLog || [];
    state.backupReminderDays = (restored.backupReminderDays !== undefined) ? restored.backupReminderDays : 7;
    if (restored.lastBackupDate) state.lastBackupDate = restored.lastBackupDate;
    saveBackupPrefs();

    // Write to Firestore in batches of 20 to avoid rate limits
    if (!DEMO_MODE && db) {
      const BATCH = 20;
      const allWrites = [
        ...state.users.map(u    => ({ col:'users',   id:u.id,  data:u  })),
        ...state.entries.map(en => ({ col:'entries', id:en.id, data:en })),
        ...state.auditLog.map(a => ({ col:'audit',   id:a.id,  data:a  })),
      ];
      const total = allWrites.length;
      let done = 0;
      for (let i = 0; i < allWrites.length; i += BATCH) {
        const batch = allWrites.slice(i, i + BATCH);
        await Promise.all(batch.map(w => fbSetDoc(fbDoc(db, w.col, w.id), w.data)));
        done += batch.length;
        setProgress(`Restoring… ${done} of ${total} records`);
      }
    }

    auditLog('BACKUP_RESTORE', `Data restored from backup: ${fi.files[0].name}`);
    setProgress('Restore complete ✓');
    showToast('Restore complete ✓');
    setTimeout(() => render(), 1500);
  } catch(err) {
    if (btnEl) btnEl.disabled = false;
    setProgress('Restore failed: ' + err.message);
    showToast('Restore failed: ' + err.message);
  }
};

window.saveBackupSettings = function() {
  const raw = document.getElementById('backup-days').value;
  const days = raw === '' ? 7 : parseInt(raw);
  state.backupReminderDays = isNaN(days) ? 7 : days;
  saveBackupPrefs();
  showToast(days === 0 ? 'Backup reminder disabled' : `Reminder set to every ${days} days`);
  render();
};

function saveBackupPrefs() {
  localStorage.setItem('ts_backup_prefs', JSON.stringify({
    lastBackupDate: state.lastBackupDate,
    backupReminderDays: state.backupReminderDays
  }));
}

function loadBackupPrefs() {
  try {
    const saved = JSON.parse(localStorage.getItem('ts_backup_prefs') || '{}');
    if (saved.lastBackupDate) state.lastBackupDate = saved.lastBackupDate;
    if (saved.backupReminderDays !== undefined) state.backupReminderDays = saved.backupReminderDays;
  } catch(e) {}
}

function checkYearEndReminder() {
  const ye = state.yearEndSettings || { day:5, month:4 };
  const now = new Date();
  function getYearEnd(year) { return new Date(year, ye.month - 1, ye.day); }
  let lastYearEnd = getYearEnd(now.getFullYear());
  if (lastYearEnd > now) lastYearEnd = getYearEnd(now.getFullYear() - 1);
  const lastYearEndStr = lastYearEnd.toISOString().slice(0,10);
  const isLastFrozen = state.freezePeriods.some(p => p.period_end === lastYearEndStr);
  if (!isLastFrozen && lastYearEnd < now) {
    if (confirm(`Year end ${lastYearEndStr} has passed and earnings are not yet frozen.

Go to Year End & Freeze now?`)) {
      nav('config');
      setTimeout(() => nav('freeze'), 100);
    }
  }
}

function checkBackupReminder() {
  if (state.backupReminderDays === 0) return;  // disabled
  if (!state.lastBackupDate) {
    // Never backed up
    setTimeout(() => {
      if (confirm('No backup has ever been made.\nExport a backup now?')) exportBackup();
    }, 2000);
    return;
  }
  const last = new Date(state.lastBackupDate);
  const daysSince = Math.floor((Date.now() - last.getTime()) / 86400000);
  if (daysSince >= state.backupReminderDays) {
    setTimeout(() => {
      if (confirm(`Backup reminder: last backup was ${daysSince} days ago.\nExport a backup now?`)) exportBackup();
    }, 2000);
  }
}

// ═══════════════════════════════════
// CONNECTIVITY
// ═══════════════════════════════════
function checkOnlineAsync() {
  // Use navigator.onLine — instant, no network round trip needed
  // The Firebase SDK load will fail naturally if truly offline
  return Promise.resolve(navigator.onLine !== false);
}

window.checkOnline = function() {
  state.online = navigator.onLine !== false;
  render();
};

window.refreshApp = async function() {
  // Quick offline check first
  if (navigator.onLine === false) {
    state.online = false;
    render();
    return;
  }

  // Set dot to amber/checking while we verify Firebase is actually reachable
  state.online = null;
  render();

  if (!DEMO_MODE && db) {
    try {
      // Real Firebase ping — fetch users collection (small, fast)
      // This confirms Firebase is reachable, not just that wifi is connected
      await Promise.race([
        loadFirebaseData(),
        new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 10000))
      ]);
      state.online = true;
      showToast('Data refreshed ✓');
    } catch(e) {
      state.online = false;
      showToast('Firebase unreachable — check connection');
    }
  } else {
    state.online = navigator.onLine !== false;
  }
  render();
};

window.exitApp = function() {
  if (confirm('Exit TimeShift?')) {
    logout();
  }
};

// Back FAB handler — go back logically
window.handleBackFab = function() {
  const screen = state.screen;
  // Config sub-screens go back to config
  if (['users','audit','backup','settings','freeze'].includes(screen)) {
    nav('config');
  } else if (screen === 'admin-drill') {
    nav('reports');
  } else {
    nav('home');
  }
};

// ── Android hardware back button — double press to exit ──
(function() {
  let _exitWarned = false;
  let _exitTimer = null;
  let _exitReady = false;

  // Push one buffer state
  history.pushState(null, '', location.href);

  window.addEventListener('popstate', function() {
    if (_exitReady) return; // clean exit

    // Maintain buffer
    history.replaceState(null, '', location.href);

    // If logged in and not on home — go back instead of exit
    if (state.currentUser && state.screen !== 'home') {
      handleBackFab();
      return;
    }

    if (_exitWarned) {
      // Second press within 2.5s — exit
      _exitWarned = false;
      if (_exitTimer) { clearTimeout(_exitTimer); _exitTimer = null; }
      const t = document.getElementById('exit-toast');
      if (t) t.style.display = 'none';
      _exitReady = true;
      logout();
      return;
    }

    // First press — show toast
    _exitWarned = true;
    const t = document.getElementById('exit-toast');
    if (t) t.style.display = 'block';
    if (_exitTimer) clearTimeout(_exitTimer);
    _exitTimer = setTimeout(function() {
      _exitWarned = false;
      _exitTimer = null;
      const t = document.getElementById('exit-toast');
      if (t) t.style.display = 'none';
    }, 2500);
  });
})();

window.addEventListener('online', () => {
  // Browser says online — verify Firebase is actually reachable
  state.online = null; render();
  if (!DEMO_MODE && db) {
    loadFirebaseData()
      .then(() => { state.online = true; render(); showToast('Reconnected ✓'); })
      .catch(() => { state.online = false; render(); });
  } else {
    state.online = true; render();
  }
});
window.addEventListener('offline', () => { state.online = false; render(); });

// ═══════════════════════════════════
// STARTUP — Road Eagles blocking pattern
// Prevents PIN screen showing until data confirmed from Firebase
// ═══════════════════════════════════
async function _tsRunStartup() {
  const TIMEOUT_MS = 20000; // 20 seconds

  // Step 1 — Check connectivity
  _tsSetMsg('Checking connection…');
  const online = await checkOnlineAsync();
  if (!online) {
    state.online = false;
    _tsShowBlocked('No internet connection.\nPlease check your connection and try again.');
    return;
  }
  state.online = true;

  // Step 2 — Initialise Firebase (synchronous with compat SDK)
  _tsSetMsg('Connecting to Firebase…');
  try {
    initFirebase();
    if (DEMO_MODE || !db) throw new Error(state.firebaseError || 'Firebase failed to initialise');
  } catch(e) {
    _tsShowBlocked('Could not connect to the database.\nPlease check your connection and try again.\n\n' + e.message);
    return;
  }

  // Step 3 — Load data from Firestore
  _tsSetMsg('Loading your data…');
  try {
    await Promise.race([
      loadFirebaseData(),
      new Promise((_, reject) => setTimeout(() => reject(new Error('Data load timed out')), TIMEOUT_MS))
    ]);
  } catch(e) {
    _tsShowBlocked('Could not load data from the database.\nPlease check your connection and try again.\n\n' + e.message);
    return;
  }

  // Step 4 — All good, show PIN screen
  loadBackupPrefs();
  setTimeout(() => _tsShowPinScreen(), 400); // brief pause so "Loading data…" is visible
}

// Run on load
_tsRunStartup();
