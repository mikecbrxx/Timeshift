<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="theme-color" content="#FF6B8A"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="TimeShift"/>
<title>TimeShift</title>
<link rel="manifest" href="./manifest.json"/>
<link rel="apple-touch-icon" href="./apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root {
    --coral: #FF6B8A;
    --coral-light: #FF8FA3;
    --coral-dark: #E84D6F;
    --violet: #7C5CBF;
    --violet-light: #9B7FD4;
    --violet-dark: #5E3FA3;
    --teal: #00B4C5;
    --teal-light: #33C9D8;
    --amber: #FFB347;
    --green: #52C97E;
    --bg: #FBF7FF;
    --bg2: #F3EEF9;
    --card: #FFFFFF;
    --text: #2D2040;
    --text2: #6B5B8A;
    --text3: #A89BC2;
    --border: #E8DFF5;
    --shadow: 0 4px 24px rgba(124,92,191,0.10);
    --shadow-lg: 0 8px 40px rgba(124,92,191,0.16);
    --radius: 18px;
    --radius-sm: 10px;
    --font-head: 'Sora', sans-serif;
    --font-body: 'Nunito', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  /* Global SVG size cap — prevents unsized inline SVG icons from ballooning */
  svg { width: 14px; height: 14px; flex-shrink: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
  }
  #app { height: 100%; display: flex; flex-direction: column; }

  /* ── SCROLLABLE CONTENT ── */
  .screen { flex: 1; overflow-y: auto; padding: 0 0 72px; }
  .screen::-webkit-scrollbar { width: 4px; }
  .screen::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── TOP BAR ── */
  .topbar {
    background: white;
    border-bottom: 1.5px solid var(--border);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(124,92,191,0.07);
  }
  .topbar-logo { display: flex; align-items: center; gap: 10px; }
  .topbar-logo svg { width: 26px; height: 26px; }
  .topbar-title { font-family: var(--font-head); font-weight: 700; font-size: 15px; color: var(--violet-dark); }
  .topbar-sub { font-size: 11px; color: var(--text3); font-weight: 500; }
  .topbar-user { display: flex; align-items: center; gap: 8px; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--coral), var(--violet));
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 10px;
    font-family: var(--font-head);
    cursor: pointer; flex-shrink: 0;
  }

  /* ── OFFLINE BANNER ── */
  .offline-banner {
    background: #2D2040; color: white;
    text-align: center; padding: 8px 16px;
    font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    flex-shrink: 0; z-index: 50;
    animation: fadeIn 0.3s ease;
  }
  .offline-banner svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* ── OFFLINE BLOCKER ── */
  .offline-screen {
    position: fixed; inset: 0;
    background: linear-gradient(160deg, var(--violet-dark) 0%, #3A1F7A 40%, #1A0F3E 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 250; padding: 40px 30px; text-align: center;
  }
  .offline-screen h2 { font-family: var(--font-head); font-weight: 800; font-size: 24px; color: white; margin: 20px 0 10px; }
  .offline-screen p { color: rgba(255,255,255,0.65); font-size: 14px; margin-bottom: 28px; }

  /* ── TRAFFIC LIGHT ── */
  .traffic-light {
    display: flex; align-items: center; gap: 6px;
    margin-left: 4px;
  }
  .tl-dot {
    width: 10px; height: 10px; border-radius: 50%;
    transition: background 0.4s, box-shadow 0.4s;
    flex-shrink: 0;
  }
  .tl-dot.online  { background: #52C97E; box-shadow: 0 0 6px #52C97E; }
  .tl-dot.offline { background: #FF4D4D; box-shadow: 0 0 6px #FF4D4D; }
  .tl-dot.checking { background: var(--amber); box-shadow: 0 0 6px var(--amber); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

  /* ── TOPBAR ACTIONS ── */
  .topbar-actions { display: flex; align-items: center; gap: 6px; }
  .topbar-btn {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--bg2); border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text2); flex-shrink: 0;
    transition: background 0.15s, color 0.15s;
  }
  .topbar-btn:hover { background: var(--border); color: var(--text); }
  .topbar-btn svg { width: 13px; height: 13px; }
  .topbar-btn.back { color: var(--violet); }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    background: white;
    border-top: 1.5px solid var(--border);
    display: flex;
    padding: 0;
    flex-shrink: 0;
    box-shadow: 0 -2px 16px rgba(124,92,191,0.08);
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 7px 4px 5px;
    cursor: pointer; border: none; background: none;
    color: var(--text3); transition: color 0.2s;
    font-family: var(--font-body);
    position: relative; font-size: 9px;
  }
  .nav-btn.active { color: var(--coral); }
  .nav-btn svg { width: 17px; height: 17px; margin-bottom: 2px; }
  .topbar-logo svg { width: 26px !important; height: 26px !important; }
  .topbar-btn svg { width: 13px !important; height: 13px !important; }
  .empty svg { width: 36px !important; height: 36px !important; }
  .pin-logo svg { width: 64px !important; height: 64px !important; }
  .offline-screen svg.logo { width: 64px !important; height: 64px !important; }
  .modal-close svg { width: 14px !important; height: 14px !important; }
  .profile-menu-item svg { width: 14px !important; height: 14px !important; }
  .user-card-info svg { width: 12px !important; height: 12px !important; }
  .btn svg { width: 12px !important; height: 12px !important; }
  .btn-sm svg { width: 11px !important; height: 11px !important; }
  .stat-card svg { width: 12px !important; height: 12px !important; }
  .entry-item svg { width: 12px !important; height: 12px !important; }
  .tl-dot { flex-shrink: 0; }
  svg.logo-svg { width: auto !important; height: auto !important; }
  .nav-btn span { font-size: 9px; font-weight: 600; letter-spacing: 0.3px; }
  .nav-btn.active::after {
    content: '';
    position: absolute; top: 0; left: 20%; right: 20%;
    height: 3px; background: var(--coral); border-radius: 0 0 4px 4px;
  }

  /* ── CARDS ── */
  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); border: 1.5px solid var(--border);
    padding: 12px 14px;
  }
  .card-sm { padding: 8px 12px; border-radius: var(--radius-sm); }

  /* ── SECTION HEADER ── */
  .section-head {
    padding: 10px 14px 6px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-head h2 {
    font-family: var(--font-head); font-weight: 700; font-size: 14px; color: var(--text);
  }
  .section-head .sub { font-size: 10px; color: var(--text3); margin-top: 1px; }

  /* ── STAT CARDS ── */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 14px; }
  .stat-card {
    border-radius: var(--radius-sm); padding: 10px 12px;
    position: relative; overflow: hidden;
  }
  .stat-card .label { font-size: 9px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; opacity: 0.75; margin-bottom: 3px; }
  .stat-card .value { font-family: var(--font-head); font-weight: 800; font-size: 16px; line-height: 1; }
  .stat-card .sub-val { font-size: 9px; margin-top: 3px; opacity: 0.7; }
  .stat-card .blob {
    position: absolute; right: -10px; bottom: -10px;
    width: 60px; height: 60px; border-radius: 50%;
    opacity: 0.15;
  }
  .stat-coral { background: linear-gradient(135deg, #FF6B8A, #FF8FA3); color: white; }
  .stat-violet { background: linear-gradient(135deg, #7C5CBF, #9B7FD4); color: white; }
  .stat-teal { background: linear-gradient(135deg, #00B4C5, #33C9D8); color: white; }
  .stat-amber { background: linear-gradient(135deg, #FFB347, #FFC97A); color: white; }
  .stat-green { background: linear-gradient(135deg, #52C97E, #7DDEA0); color: white; }

  /* ── TODAY HERO ── */
  .today-hero {
    margin: 8px 14px 0;
    background: linear-gradient(135deg, var(--violet-dark) 0%, var(--coral) 100%);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    color: white;
    position: relative;
    overflow: hidden;
  }
  .today-hero::before {
    content: '';
    position: absolute; top: -30px; right: -20px;
    width: 120px; height: 120px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .today-hero::after {
    content: '';
    position: absolute; bottom: -40px; left: 30px;
    width: 90px; height: 90px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .today-hero .date-label { font-size: 10px; font-weight: 600; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.5px; }
  .today-hero .hours-big { font-family: var(--font-head); font-weight: 800; font-size: 32px; line-height: 1; margin: 3px 0 2px; }
  .today-hero .shifts-label { font-size: 10px; opacity: 0.75; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 8px 14px; border-radius: 50px; border: none; cursor: pointer;
    font-family: var(--font-body); font-weight: 700; font-size: 12px;
    transition: all 0.18s; text-decoration: none;
  }
  .btn-primary { background: linear-gradient(135deg, var(--coral), var(--coral-dark)); color: white; box-shadow: 0 4px 16px rgba(255,107,138,0.35); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,107,138,0.45); }
  .btn-secondary { background: var(--bg2); color: var(--violet-dark); border: 1.5px solid var(--border); }
  .btn-violet { background: linear-gradient(135deg, var(--violet), var(--violet-dark)); color: white; box-shadow: 0 4px 16px rgba(124,92,191,0.30); }
  .btn-teal { background: linear-gradient(135deg, var(--teal), #0099A8); color: white; }
  .btn-danger { background: #FFE8EE; color: #D63360; border: 1.5px solid #FFCCD8; }
  .btn-sm { padding: 5px 10px; font-size: 11px; }
  .btn-icon { padding: 6px; border-radius: 8px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-full { width: 100%; }

  /* ── FORMS ── */
  .form-group { margin-bottom: 8px; }
  .form-group label { display: block; font-size: 10px; font-weight: 700; color: var(--text2); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.4px; }
  .form-group input, .form-group select {
    width: 100%; padding: 7px 10px; border-radius: var(--radius-sm);
    border: 1.5px solid var(--border); background: var(--bg);
    font-family: var(--font-body); font-size: 13px; color: var(--text);
    outline: none; transition: border-color 0.18s;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--violet-light); background: white; }
  .form-group .hint { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(44,32,64,0.45);
    backdrop-filter: blur(4px);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 100;
    animation: fadeIn 0.18s ease;
  }
  .modal {
    background: white; width: 100%; max-width: 480px;
    border-radius: 24px 24px 0 0;
    padding: 16px 16px 24px;
    animation: slideUp 0.22s ease;
    max-height: 92vh; overflow-y: auto;
  }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .modal-title { font-family: var(--font-head); font-weight: 700; font-size: 14px; color: var(--text); }
  .modal-close { width: 32px; height: 32px; border-radius: 50%; background: var(--bg2); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text2); font-size: 18px; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  /* ── PIN SCREEN ── */
  .pin-screen {
    position: fixed; inset: 0;
    background: linear-gradient(160deg, var(--violet-dark) 0%, #3A1F7A 40%, #1A0F3E 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 200; padding: 40px 30px;
  }
  .pin-logo { margin-bottom: 32px; }
  .pin-title { font-family: var(--font-head); font-weight: 800; font-size: 28px; color: white; margin-bottom: 6px; text-align: center; }
  .pin-subtitle { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 36px; text-align: center; }
  .pin-dots { display: flex; gap: 14px; margin-bottom: 36px; }
  .pin-dot {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.4);
    transition: all 0.15s;
  }
  .pin-dot.filled { background: var(--coral); border-color: var(--coral); transform: scale(1.1); }
  .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 280px; }
  .pin-key {
    height: 64px; border-radius: 16px;
    background: rgba(255,255,255,0.10);
    border: 1.5px solid rgba(255,255,255,0.15);
    color: white; font-family: var(--font-head); font-weight: 700; font-size: 22px;
    cursor: pointer; transition: all 0.12s;
    display: flex; align-items: center; justify-content: center;
  }
  .pin-key:active { transform: scale(0.94); background: rgba(255,255,255,0.22); }
  .pin-key.del { font-size: 16px; color: rgba(255,255,255,0.7); }
  .pin-key.empty { background: transparent; border-color: transparent; cursor: default; }
  .pin-error { color: var(--coral-light); font-size: 13px; margin-bottom: 12px; text-align: center; min-height: 20px; }
  .pin-switch { color: rgba(255,255,255,0.55); font-size: 13px; margin-top: 20px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  /* ── SHIFT ENTRY ── */
  .shift-row {
    background: var(--bg); border-radius: var(--radius-sm);
    padding: 7px 10px; margin-bottom: 6px;
    border: 1.5px solid var(--border);
  }
  .shift-row-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
  .shift-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px;
  }
  .badge-1 { background: #FFE8EE; color: #D63360; }
  .badge-2 { background: #EDE6FF; color: #5E3FA3; }
  .badge-3 { background: #E0F7FA; color: #006064; }
  .shift-duration { font-family: var(--font-head); font-weight: 700; font-size: 12px; color: var(--violet); }

  /* ── ENTRY LIST ── */
  .entry-item {
    padding: 8px 10px; border-radius: var(--radius-sm);
    background: white; border: 1.5px solid var(--border);
    margin-bottom: 6px; cursor: pointer;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .entry-item:hover { box-shadow: var(--shadow); border-color: var(--violet-light); }
  .entry-item-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
  .entry-date { font-weight: 700; font-size: 12px; color: var(--text); }
  .entry-total { font-family: var(--font-head); font-weight: 800; font-size: 13px; color: var(--coral); }
  .entry-shifts { font-size: 10px; color: var(--text3); }
  .entry-actions { display: flex; gap: 6px; margin-top: 6px; }

  /* ── REPORT ── */
  .report-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 20px 16px; }
  .report-cell { background: var(--bg2); border-radius: var(--radius-sm); padding: 12px 10px; text-align: center; }
  .report-cell .rc-label { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
  .report-cell .rc-val { font-family: var(--font-head); font-weight: 800; font-size: 17px; color: var(--violet-dark); }

  /* ── USERS ── */
  .user-card {
    background: white; border-radius: var(--radius); border: 1.5px solid var(--border);
    box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px;
    overflow: hidden; position: relative;
  }
  .user-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .user-card-avatar {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-head); font-weight: 800; font-size: 13px; color: white;
  }
  .user-card-name { font-weight: 700; font-size: 13px; color: var(--text); }
  .user-card-role { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; display: inline-block; margin-top: 2px; }
  .role-admin { background: #EDE6FF; color: var(--violet-dark); }
  .role-user { background: #FFE8EE; color: var(--coral-dark); }
  .user-card-info { font-size: 11px; color: var(--text2); line-height: 1.6; }
  .user-card-info span { display: flex; align-items: center; gap: 5px; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: white; padding: 10px 20px;
    border-radius: 50px; font-size: 13px; font-weight: 600;
    z-index: 300; animation: fadeIn 0.2s ease;
    white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }

  /* ── TABS ── */
  .tab-row { display: flex; gap: 6px; padding: 0 14px 10px; overflow-x: auto; }
  .tab-row::-webkit-scrollbar { display: none; }
  .tab-pill {
    padding: 5px 12px; border-radius: 50px; font-size: 11px; font-weight: 700;
    border: 1.5px solid var(--border); background: white; color: var(--text2);
    cursor: pointer; white-space: nowrap; transition: all 0.15s;
  }
  .tab-pill.active { background: var(--violet); color: white; border-color: var(--violet); }

  /* ── DIVIDER ── */
  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  /* ── EMPTY ── */
  .empty { text-align: center; padding: 24px 14px; color: var(--text3); }
  .empty svg { width: 36px; height: 36px; margin-bottom: 8px; opacity: 0.4; }
  .empty p { font-size: 14px; }

  /* ── CHIP ── */
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .chip-green { background: #E6F9EF; color: #1A7A42; }
  .chip-red { background: #FFE8EE; color: #D63360; }
  .chip-amber { background: #FFF4E5; color: #A05A00; }

  /* ── MISC ── */
  .page-pad { padding: 0 14px; }
  .mt-4 { margin-top: 10px; }
  .mb-4 { margin-bottom: 10px; }
  .flex-row { display: flex; align-items: center; gap: 10px; }
  .flex-between { display: flex; align-items: center; justify-content: space-between; }
  .text-sm { font-size: 13px; }
  .text-xs { font-size: 11px; }
  .text-muted { color: var(--text3); }
  .text-violet { color: var(--violet); }
  .text-coral { color: var(--coral); }
  .fw-700 { font-weight: 700; }
  .fw-800 { font-weight: 800; font-family: var(--font-head); }
  .hidden { display: none !important; }
  select option { font-family: var(--font-body); }

  /* ── PROFILE MENU ── */
  .profile-menu {
    position: fixed; top: 48px; right: 12px;
    background: white; border-radius: 16px; border: 1.5px solid var(--border);
    box-shadow: var(--shadow-lg); z-index: 150; min-width: 180px;
    overflow: hidden; animation: fadeIn 0.15s ease;
  }
  .profile-menu-item {

<body>

<script type="module">
// ════════════════════════════════════════════════════════════
// SHIFTLOG APP — Full Implementation
// ════════════════════════════════════════════════════════════

// ══════════════════════════════════════════
// VERSION — update this with every release
// ══════════════════════════════════════════
const APP_VERSION = '1.3';

// ── FIREBASE CONFIG ───────────────────────────────────────
// Loaded from localStorage (set via Admin → Config screen)
// Falls back to DEMO_MODE if not configured
function getFirebaseConfig() {
  try { return JSON.parse(localStorage.getItem('ts_firebase') || 'null'); } catch { return null; }
}

// ── DEMO MODE (runs without Firebase) ─────────────────────
let DEMO_MODE = !getFirebaseConfig();

// ── FIREBASE SDK (loaded dynamically when config exists) ──
let db = null;
let fbApp = null;

// Module-level Firestore function references
let fbCollection, fbDoc, fbGetDocs, fbSetDoc, fbUpdateDoc, fbDeleteDoc;

async function initFirebase() {
  const cfg = getFirebaseConfig();
  if (!cfg) { DEMO_MODE = true; return; }
  try {
    const { initializeApp, getApps } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const fs = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');

    // Assign all Firestore helpers FIRST before using any of them
    fbCollection = fs.collection;
    fbDoc        = fs.doc;
    fbGetDocs    = fs.getDocs;
    fbSetDoc     = fs.setDoc;
    fbUpdateDoc  = fs.updateDoc;
    fbDeleteDoc  = fs.deleteDoc;

    // Now safe to use fs.getFirestore
    fbApp = getApps().length ? getApps()[0] : initializeApp(cfg);
    db    = fs.getFirestore(fbApp);

    DEMO_MODE = false;
    state.fbStatus = 'Connected to Firebase ✓';
  } catch(e) {
    DEMO_MODE = true;
    state.fbStatus = 'Firebase error: ' + e.message;
    showToast('Firebase error: ' + e.message);
  }
}

// ═══════════════════════════════════

// DEMO DATA
// ═══════════════════════════════════

    for (let d = 0; d < 60; d++) {
      if (Math.random() > 0.35) {
        const date = new Date(today);
        date.setDate(date.getDate() - d);
        const dateStr = formatDate(date);

        const numShifts = Math.random() > 0.7 ? 2 : 1;
        const shifts = [];
        let startH = 7 + Math.floor(Math.random() * 3);
        for (let s = 0; s < numShifts; s++) {
          const dur = 3 + Math.floor(Math.random() * 5);
          const endH = startH + dur;
          shifts.push({ start: `${String(startH).padStart(2,'0')}:00`, end: `${String(endH % 24).padStart(2,'0')}:00` });
          startH = endH + 1;
        }
        const totalMins = shifts.reduce((acc, sh) => {
          return acc + roundShift(parseTime(sh.start), parseTime(sh.end));
        }, 0);

        entries.push({ id: String(id++), user_id: uid, date: dateStr, shifts, total_mins: totalMins, note: '' });

// ═══════════════════════════════════
// TIME HELPERS
// ═══════════════════════════════════
function parseTime(str) { // "HH:MM" -> minutes from midnight
  const [h, m] = str.split(':').map(Number);
  return h * 60 + m;
}

function formatMins(mins) { // 90 -> "1h 30m"
  if (mins <= 0) return '0h 0m';
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

function roundShift(startMins, endMins) {
  // Handle overnight
  if (endMins <= startMins) endMins += 24 * 60;
  const raw = endMins - startMins;
  return Math.round(raw / 15) * 15;
}

function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

function parseDate(str) { // "YYYY-MM-DD"
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function displayDate(str) {
  const d = parseDate(str);
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}

function displayDateShort(str) {
  const d = parseDate(str);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

function todayStr() { return formatDate(new Date()); }

function getWeekBounds(d = new Date()) {
  const day = d.getDay(); // 0=Sun
  const diff = (day === 0 ? -6 : 1) - day; // Monday
  const mon = new Date(d); mon.setDate(d.getDate() + diff); mon.setHours(0,0,0,0);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6); sun.setHours(23,59,59,999);
  return { start: mon, end: sun };
}

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ═══════════════════════════════════
// DATA ACCESS
// ═══════════════════════════════════
function userEntries(userId, entries) {
  return (entries || state.entries).filter(e => e.user_id === userId);
}

function entriesForPeriod(userId, filter) {
  const ue = userEntries(userId);
  return ue.filter(e => {
    const d = parseDate(e.date);
    if (filter.date) return e.date === filter.date;
    if (filter.month !== undefined) return d.getMonth() === filter.month && d.getFullYear() === filter.year;
    if (filter.year) return d.getFullYear() === filter.year;
    if (filter.weekStart) return d >= filter.weekStart && d <= filter.weekEnd;
    return true;
  });
}

function sumMins(entries) {
  return entries.reduce((a, e) => a + e.total_mins, 0);
}

function dashboardStats(userId) {
  const today = todayStr();
  const now = new Date();

  const todayEntries = entriesForPeriod(userId, { date: today });
  const todayMins = sumMins(todayEntries);

  // Last worked day
  const sorted = userEntries(userId).sort((a,b) => b.date.localeCompare(a.date));
  const lastEntry = sorted.find(e => e.date < today) || sorted[0];

  const week = getWeekBounds(now);
  const weekMins = sumMins(entriesForPeriod(userId, { weekStart: week.start, weekEnd: week.end }));

  const monthMins = sumMins(entriesForPeriod(userId, { month: now.getMonth(), year: now.getFullYear() }));
  const yearMins = sumMins(entriesForPeriod(userId, { year: now.getFullYear() }));

  return { todayMins, lastEntry, weekMins, monthMins, yearMins };
}

  const user = state.users.find(u => u.pin === pin && u.active);

    state.pinError = 'Incorrect PIN. Please try again.';
    state.pinInput = '';
    render();
  }
}

// ── LOG SHIFT ──
function renderLog() {
  const editData = state.modalData.editEntry || {};
  const isEdit = !!editData.id;
  const today = todayStr();
  const date = editData.date || today;
  const shifts = editData.shifts || [{ start: '', end: '' }];
  const note = editData.note || '';

  const shiftRows = shifts.map((sh, i) => {
    const dur = (sh.start && sh.end) ? roundShift(parseTime(sh.start), parseTime(sh.end)) : 0;
    const badges = ['badge-1','badge-2','badge-3'];
    return `<div class="shift-row" id="shift-${i}">
      <div class="shift-row-head">
        <span class="shift-badge ${badges[i]}">Shift ${i+1}</span>
        <span class="shift-duration">${dur > 0 ? formatMins(dur) : '—'}</span>
        ${i > 0 ? `<button class="btn btn-danger btn-sm btn-icon" onclick="removeShift(${i})">${icons.x}</button>` : ''}
      </div>
      <div class="form-row">
        <div class="form-group" style="margin-bottom:0">
          <label>Start</label>
          <input type="time" value="${sh.start}" onchange="updateShift(${i},'start',this.value)" oninput="updateShift(${i},'start',this.value)"/>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label>End</label>
          <input type="time" value="${sh.end}" onchange="updateShift(${i},'end',this.value)" oninput="updateShift(${i},'end',this.value)"/>
          ${sh.end && sh.start && parseTime(sh.end) <= parseTime(sh.start) ? '<div class="hint text-violet">⚡ Ends next day</div>' : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  const totalMins = shifts.reduce((acc, sh) => {
    if (!sh.start || !sh.end) return acc;
    return acc + roundShift(parseTime(sh.start), parseTime(sh.end));
  }, 0);

  return `
    <div class="section-head">
      <div>
        <h2>${isEdit ? 'Edit Entry' : 'Log Shifts'}</h2>
        <div class="sub">Enter your shift times for the day</div>
      </div>
    </div>
    <div class="page-pad">
      <div class="form-group">
        <label>${icons.calendar} Date</label>
        <input type="date" value="${date}" max="${today}" id="log-date" onchange="updateLogDate(this.value)"/>
      </div>
      ${shiftRows}
      ${shifts.length < 3 ? `<button class="btn btn-secondary btn-full mb-4" onclick="addShift()">
        ${icons.plus} Add Another Shift
      </button>` : ''}
      ${totalMins > 0 ? `<div class="card card-sm mb-4" style="background:linear-gradient(135deg,#F0EBFF,#FFE8EE);border-color:var(--violet-light)">
        <div class="flex-between">
          <span style="font-weight:700;color:var(--text2);">Total for day</span>
          <span class="fw-800 text-violet" style="font-size:14px;">${formatMins(totalMins)}</span>
        </div>
        <div class="text-xs text-muted mt-1">Rounded to nearest 15 mins per shift</div>
      </div>` : ''}
      <div class="form-group">
        <label>Note (optional)</label>
        <input type="text" placeholder="e.g. Covered for colleague" value="${note}" id="log-note"/>
      </div>
      <button class="btn btn-primary btn-full" onclick="saveEntry()">
        ${isEdit ? icons.edit + ' Update Entry' : icons.plus + ' Save Entry'}
      </button>
      ${isEdit ? `<button class="btn btn-danger btn-full mt-4" onclick="deleteEntry('${editData.id}')">
        ${icons.trash} Delete Entry
      </button>` : ''}
    </div>
    <div style="height:20px;"></div>`;
}

// ── ENTRIES ──
function renderEntries() {
  const u = state.currentUser;
  const year = state.entriesYear;
  const month = state.entriesMonth;

  const monthEntries = state.entries
    .filter(e => e.user_id === u.id)
    .filter(e => {
      const d = parseDate(e.date);
      return d.getMonth() === month && d.getFullYear() === year;
    })
    .sort((a,b) => b.date.localeCompare(a.date));

  const totalMins = sumMins(monthEntries);

  // Month nav
  const prevMonth = () => {
    let m = month - 1, y = year;
    if (m < 0) { m = 11; y--; }
    return { m, y };
  };
  const nextMonth = () => {
    let m = month + 1, y = year;
    if (m > 11) { m = 0; y++; }
    return { m, y };
  };
  const next = nextMonth();
  const prev = prevMonth();
  const isThisMonthOrFuture = (year > new Date().getFullYear()) ||
    (year === new Date().getFullYear() && month >= new Date().getMonth());

  const rows = monthEntries.map(e => {
    const shiftInfo = e.shifts.map((s,i) => `S${i+1}: ${s.start}–${s.end}`).join(' · ');
    return `<div class="entry-item">
      <div class="entry-item-top">
        <div>
          <div class="entry-date">${displayDate(e.date)}</div>
          <div class="entry-shifts">${shiftInfo}</div>
          ${e.note ? `<div class="text-xs text-muted" style="margin-top:3px;">${e.note}</div>` : ''}
        </div>
        <div class="entry-total">${formatMins(e.total_mins)}</div>
      </div>
      <div class="entry-actions">
        <button class="btn btn-secondary btn-sm" onclick="editEntry('${e.id}')">${icons.edit} Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteEntry('${e.id}')">${icons.trash} Delete</button>
      </div>
    </div>`;
  }).join('');

  return `
    <div class="section-head">
      <div><h2>Entries</h2><div class="sub">All your logged shifts</div></div>
    </div>
    <div class="flex-between page-pad mb-4">
      <button class="btn btn-secondary btn-icon btn-sm" onclick="setEntriesMonth(${prev.m},${prev.y})">${icons.chevronLeft}</button>
      <div style="font-weight:700;font-size:13px;">${MONTH_NAMES[month]} ${year}</div>
      <button class="btn btn-secondary btn-icon btn-sm" ${isThisMonthOrFuture ? 'disabled' : ''} onclick="setEntriesMonth(${next.m},${next.y})">${icons.chevronRight}</button>
    </div>
    ${totalMins > 0 ? `<div class="page-pad mb-4">
      <div class="card card-sm" style="background:linear-gradient(135deg,#F0EBFF,#FFE8EE);border-color:var(--violet-light);">
        <div class="flex-between">
          <span class="fw-700 text-muted text-sm">Month Total</span>
          <span class="fw-800 text-violet" style="font-size:14px;">${formatMins(totalMins)}</span>
        </div>
        <div class="text-xs text-muted mt-1">${monthEntries.length} day${monthEntries.length !== 1 ? 's' : ''} worked</div>
      </div>
    </div>` : ''}
    <div class="page-pad">
      ${rows || `<div class="empty">${icons.clock}<p>No entries for ${MONTH_SHORT[month]} ${year}</p></div>`}
    </div>
    <div style="height:20px;"></div>`;
}

// ── REPORTS ──
function renderReports() {
  const u = state.currentUser;
  const now = new Date();

  // Week report
  function weekReport() {
    const week = getWeekBounds(now);
    const entries = state.entries.filter(e => {
      if (e.user_id !== u.id) return false;
      const d = parseDate(e.date);
      return d >= week.start && d <= week.end;
    });
    const days = entries.sort((a,b) => a.date.localeCompare(b.date));
    const total = sumMins(entries);
    return `<div class="page-pad">
      <div class="card card-sm mb-4" style="background:linear-gradient(135deg,#E0F7FA,#E8F5E9);">
        <div class="flex-between">
          <span class="fw-700" style="color:#00696F;">Week Total</span>
          <span class="fw-800 text-violet" style="font-size:14px;">${formatMins(total)}</span>
        </div>
        <div class="text-xs text-muted mt-1">${days.length} days worked · ${week.start.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${week.end.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div>
      </div>
      ${days.map(e => `<div class="entry-item" style="cursor:default;">
        <div class="flex-between">
          <div>
            <div class="fw-700 text-sm">${displayDate(e.date)}</div>
            <div class="text-xs text-muted">${e.shifts.length} shift${e.shifts.length>1?'s':''}</div>
          </div>
          <div class="fw-800 text-coral">${formatMins(e.total_mins)}</div>
        </div>
      </div>`).join('') || `<div class="empty">${icons.chart}<p>No entries this week</p></div>`}
      <button class="btn btn-teal btn-full mt-4" onclick="exportPDF('week')">${icons.download} Export PDF</button>
    </div>`;
  }

  // Month report
  function monthReport() {
    const m = state.reportMonth, y = state.reportYear;
    const entries = state.entries.filter(e => {
      if (e.user_id !== u.id) return false;
      const d = parseDate(e.date);
      return d.getMonth() === m && d.getFullYear() === y;
    }).sort((a,b) => a.date.localeCompare(b.date));
    const total = sumMins(entries);
    const prev = m === 0 ? { m:11, y:y-1 } : { m:m-1, y };
    const next = m === 11 ? { m:0, y:y+1 } : { m:m+1, y };
    const isCurrentOrFuture = y > now.getFullYear() || (y === now.getFullYear() && m >= now.getMonth());
    return `<div class="page-pad">
      <div class="flex-between mb-4">
        <button class="btn btn-secondary btn-icon btn-sm" onclick="setReportMonth(${prev.m},${prev.y})">${icons.chevronLeft}</button>
        <span class="fw-700" style="font-size:13px;">${MONTH_NAMES[m]} ${y}</span>
        <button class="btn btn-secondary btn-icon btn-sm" ${isCurrentOrFuture?'disabled':''} onclick="setReportMonth(${next.m},${next.y})">${icons.chevronRight}</button>
      </div>
      <div class="card card-sm mb-4" style="background:linear-gradient(135deg,#FFF0F3,#F0EBFF);border-color:var(--coral-light);">
        <div class="flex-between">
          <span class="fw-700" style="color:var(--coral-dark);">Month Total</span>
          <span class="fw-800 text-violet" style="font-size:14px;">${formatMins(total)}</span>
        </div>
        <div class="text-xs text-muted mt-1">${entries.length} days worked</div>
      </div>
      ${entries.map(e => `<div class="entry-item" style="cursor:default;">
        <div class="flex-between">
          <div>
            <div class="fw-700 text-sm">${displayDate(e.date)}</div>
            <div class="text-xs text-muted">${e.shifts.map((s,i)=>`S${i+1}: ${s.start}–${s.end}`).join(' · ')}</div>
            ${e.note?`<div class="text-xs text-muted">${e.note}</div>`:''}
          </div>
          <div class="fw-800 text-coral">${formatMins(e.total_mins)}</div>
        </div>
      </div>`).join('') || `<div class="empty">${icons.chart}<p>No entries for ${MONTH_SHORT[m]} ${y}</p></div>`}
      <button class="btn btn-teal btn-full mt-4" onclick="exportPDF('month')">${icons.download} Export PDF</button>
    </div>`;
  }

  // Year report
  function yearReport() {
    const y = state.reportYear;
    const entries = state.entries.filter(e => e.user_id === u.id && parseDate(e.date).getFullYear() === y);
    const total = sumMins(entries);
    const byMonth = Array.from({length:12}, (_,i) => {
      const me = entries.filter(e => parseDate(e.date).getMonth() === i);
      return { month: i, mins: sumMins(me), days: me.length };
    });
    return `<div class="page-pad">
      <div class="flex-between mb-4">
        <button class="btn btn-secondary btn-icon btn-sm" onclick="setReportYear(${y-1})">${icons.chevronLeft}</button>
        <span class="fw-700" style="font-size:13px;">${y}</span>
        <button class="btn btn-secondary btn-icon btn-sm" ${y >= now.getFullYear() ? 'disabled' : ''} onclick="setReportYear(${y+1})">${icons.chevronRight}</button>
      </div>
      <div class="card card-sm mb-4" style="background:linear-gradient(135deg,#FFF4E5,#FFE8EE);border-color:var(--amber);">
        <div class="flex-between">
          <span class="fw-700" style="color:#A05A00;">Year Total</span>
          <span class="fw-800 text-violet" style="font-size:14px;">${formatMins(total)}</span>
        </div>
        <div class="text-xs text-muted mt-1">${entries.length} days worked in ${y}</div>
      </div>
      ${byMonth.filter(m => m.mins > 0).map(m => `<div class="entry-item" style="cursor:default;">
        <div class="flex-between">
          <div>
            <div class="fw-700 text-sm">${MONTH_NAMES[m.month]}</div>
            <div class="text-xs text-muted">${m.days} day${m.days!==1?'s':''} worked</div>
          </div>
          <div class="fw-800 text-coral">${formatMins(m.mins)}</div>
        </div>
      </div>`).join('') || `<div class="empty">${icons.chart}<p>No entries for ${y}</p></div>`}
      <button class="btn btn-teal btn-full mt-4" onclick="exportPDF('year')">${icons.download} Export PDF</button>
    </div>`;
  }

  const tab = state.reportTab;
  return `
    <div class="section-head"><div><h2>Reports</h2><div class="sub">Your hours summary</div></div></div>
    <div class="tab-row">
      <div class="tab-pill ${tab==='week'?'active':''}" onclick="setReportTab('week')">This Week</div>
      <div class="tab-pill ${tab==='month'?'active':''}" onclick="setReportTab('month')">Month</div>
      <div class="tab-pill ${tab==='year'?'active':''}" onclick="setReportTab('year')">Year</div>
    </div>
    ${tab === 'week' ? weekReport() : tab === 'month' ? monthReport() : yearReport()}
    <div style="height:20px;"></div>`;
}

// ── ADMIN REPORTS ──
function renderAdminReports() {
  const now = new Date();
  const m = state.adminReportMonth, y = state.adminReportYear;
  const targetUid = state.adminReportUser;

  const allUsers = state.users.filter(u => u.active);
  const filterEntries = (uid) => state.entries.filter(e => {
    if (uid !== 'all' && e.user_id !== uid) return false;
    const d = parseDate(e.date);
    return d.getMonth() === m && d.getFullYear() === y;
  });

  const userOptions = [`<option value="all">All Users</option>`,
    ...allUsers.map(u => `<option value="${u.id}" ${targetUid===u.id?'selected':''}>${u.name}</option>`)
  ].join('');

  const prev = m === 0 ? { m:11, y:y-1 } : { m:m-1, y };
  const next = m === 11 ? { m:0, y:y+1 } : { m:m+1, y };
  const isFuture = y > now.getFullYear() || (y === now.getFullYear() && m >= now.getMonth());

  // Build per-user summary
  const usersToShow = targetUid === 'all' ? allUsers : allUsers.filter(u => u.id === targetUid);
  const summaryRows = usersToShow.map(u => {
    const ue = filterEntries(u.id);
    const total = sumMins(ue);
    return `<div class="entry-item" style="cursor:default;">
      <div class="flex-between">
        <div class="flex-row">
          <div class="user-card-avatar" style="width:36px;height:36px;font-size:13px;background:${u.color}">${u.initials}</div>
          <div>
            <div class="fw-700 text-sm">${u.name}</div>
            <div class="text-xs text-muted">${ue.length} day${ue.length!==1?'s':''} worked</div>
          </div>
        </div>
        <div class="fw-800 text-coral">${formatMins(total)}</div>
      </div>
    </div>`;
  }).join('');

  const grandTotal = sumMins(filterEntries(targetUid === 'all' ? undefined : targetUid).filter(e =>
    targetUid === 'all' || e.user_id === targetUid
  ));
  // Recalculate for all
  const allEntries = targetUid === 'all'
    ? state.entries.filter(e => { const d=parseDate(e.date); return d.getMonth()===m && d.getFullYear()===y; })
    : filterEntries(targetUid);
  const gt = sumMins(allEntries);

  return `
    <div class="section-head"><div><h2>Admin Reports</h2><div class="sub">Consolidated staff hours</div></div></div>
    <div class="page-pad">
      <div class="form-group">
        <label>User</label>
        <select onchange="setAdminReportUser(this.value)">${userOptions}</select>
      </div>
      <div class="flex-between mb-4">
        <button class="btn btn-secondary btn-icon btn-sm" onclick="setAdminMonth(${prev.m},${prev.y})">${icons.chevronLeft}</button>
        <span class="fw-700" style="font-size:13px;">${MONTH_NAMES[m]} ${y}</span>
        <button class="btn btn-secondary btn-icon btn-sm" ${isFuture?'disabled':''} onclick="setAdminMonth(${next.m},${next.y})">${icons.chevronRight}</button>
      </div>
      <div class="card card-sm mb-4" style="background:linear-gradient(135deg,#EDE6FF,#FFE8EE);border-color:var(--violet-light);">
        <div class="flex-between">
          <span class="fw-700 text-violet">Total Hours</span>
          <span class="fw-800" style="font-size:14px;color:var(--coral-dark);">${formatMins(gt)}</span>
        </div>
        <div class="text-xs text-muted mt-1">${allEntries.length} entries · ${targetUid === 'all' ? 'All users' : usersToShow[0]?.name}</div>
      </div>
      ${summaryRows || `<div class="empty">${icons.users}<p>No entries found</p></div>`}
      <button class="btn btn-teal btn-full mt-4" onclick="exportAdminPDF()">${icons.download} Export PDF</button>
    </div>
    <div style="height:20px;"></div>`;
}

          <button class="modal-close" onclick="closeModal()">${icons.x}</button>

          <div class="form-group"><label>Postcode</label><input type="text" id="u-postcode" placeholder="e.g. SW1A 1AA" value="${d.postcode||''}"/></div>
        </div>
        <button class="btn btn-primary btn-full" onclick="saveUser(${isEdit?`'${d.id}'`:''})">

  }

  if (modal === 'change-pin') {
    const d = state.modalData;
    return `<div class="modal-overlay" onclick="closeModalOutside(event)">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">Change PIN</div>

          <label>Confirm New PIN</label>

        </div>
        <div id="pin-change-error" style="color:var(--coral-dark);font-size:13px;min-height:18px;margin-bottom:10px;"></div>
        <button class="btn btn-primary btn-full" onclick="doChangePin()">
          ${icons.key} Change PIN
        </button>
      </div>
    </div>`;
  }

  if (modal === 'admin-reset-pin') {
    const uid = state.modalData.targetUserId;
    const user = state.users.find(u => u.id === uid);
    return `<div class="modal-overlay" onclick="closeModalOutside(event)">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">Reset PIN</div>

window.updateShift = (idx, field, val) => {
  const entry = state.modalData.editEntry || { date: todayStr(), shifts: [{start:'',end:''}], note:'' };
  if (!entry.shifts[idx]) entry.shifts[idx] = {start:'',end:''};
  entry.shifts[idx][field] = val;
  state.modalData.editEntry = entry;
  render();
};

window.addShift = () => {
  const entry = state.modalData.editEntry || { date: todayStr(), shifts: [{start:'',end:''}], note:'' };
  if (entry.shifts.length < 3) entry.shifts.push({start:'',end:''});
  state.modalData.editEntry = entry;
  render();
};

window.removeShift = (idx) => {
  const entry = state.modalData.editEntry || { date: todayStr(), shifts: [{start:'',end:''}], note:'' };
  entry.shifts.splice(idx, 1);
  state.modalData.editEntry = entry;
  render();

window.updateLogDate = (val) => {
  const entry = state.modalData.editEntry || { date: todayStr(), shifts: [{start:'',end:''}], note:'' };
  entry.date = val;
  state.modalData.editEntry = entry;
};

window.saveEntry = async () => {
  const dateEl = document.getElementById('log-date');
  const noteEl = document.getElementById('log-note');
  const entry = state.modalData.editEntry || { shifts: [{start:'',end:''}] };
  const date = dateEl ? dateEl.value : entry.date || todayStr();
  const note = noteEl ? noteEl.value : entry.note || '';

  const shifts = entry.shifts || [{start:'',end:''}];
  const validShifts = shifts.filter(s => s.start && s.end);
  if (validShifts.length === 0) { showToast('Add at least one complete shift'); return; }

  const total = validShifts.reduce((a, s) => a + roundShift(parseTime(s.start), parseTime(s.end)), 0);

  if (entry.id) {
    const updated = { ...entry, date, shifts: validShifts, total_mins: total, note };
    const idx = state.entries.findIndex(e => e.id === entry.id);
    if (idx >= 0) state.entries[idx] = updated;
    if (!DEMO_MODE && db) {
      try {
        await fbSetDoc(fbDoc(db, 'entries', entry.id), updated);
        console.log('Entry updated in Firestore:', entry.id);
      } catch(e) { console.error('Entry update failed:', e); showToast('Save failed: ' + e.message); return; }
    }
    showToast('Entry updated');
  } else {
    const id = Date.now().toString();
    const newEntry = { id, user_id: state.currentUser.id, date, shifts: validShifts, total_mins: total, note };
    state.entries.push(newEntry);
    if (!DEMO_MODE && db) {
      try {
        await fbSetDoc(fbDoc(db, 'entries', id), newEntry);
        console.log('Entry saved to Firestore:', id);
      } catch(e) { console.error('Entry save failed:', e); showToast('Save failed: ' + e.message); return; }
    }
    showToast('Entry saved');
  }
  state.modalData = {};
  state.screen = 'entries';
  render();
};

window.editEntry = (id) => {
  const entry = state.entries.find(e => e.id === id);
  if (!entry) return;
  state.modalData.editEntry = JSON.parse(JSON.stringify(entry));
  state.screen = 'log';
  render();
};

window.deleteEntry = async (id) => {
  if (!confirm('Delete this entry?')) return;
  state.entries = state.entries.filter(e => e.id !== id);

window.syncAllUsers = async () => {
  if (!db) { showToast('db is null — not connected'); return; }
  if (!fbSetDoc || !fbDoc) { showToast('Firebase functions not ready'); return; }
  const active = state.users.filter(u => u.active);
  showToast(`Syncing ${active.length} users…`);
  let ok = 0;
  for (const user of active) {
    try {
      // Strip any undefined values which Firestore rejects
      const clean = JSON.parse(JSON.stringify(user));
      await fbSetDoc(fbDoc(db, 'users', clean.id), clean);
      ok++;
    } catch(e) {
      state.fbStatus = `Sync failed on ${user.name}: ${e.message}`;
      showToast(`Failed: ${e.message}`);
      render();
      return;
    }
  }
  state.fbStatus = `Synced ${ok} of ${active.length} users to Firestore ✓`;
  showToast(`${ok} users synced to Firebase ✓`);
  render();
};

window.saveUser = async (id) => {
  const name = document.getElementById('u-name').value.trim();
  const role = document.getElementById('u-role').value;
  const phone = document.getElementById('u-phone').value.trim();
  const email = document.getElementById('u-email').value.trim();
  const address = document.getElementById('u-address').value.trim();
  const city = document.getElementById('u-city').value.trim();
  const postcode = document.getElementById('u-postcode').value.trim().toUpperCase();

  if (!name) { showToast('Name is required'); return; }

  const colors = ['#FF6B8A','#7C5CBF','#00B4C5','#FFB347','#52C97E','#E84D6F','#5E3FA3'];

  if (id) {
    const idx = state.users.findIndex(u => u.id === id);
    if (idx >= 0) {
      const updated = { ...state.users[idx], name, role, phone, email, address, city, postcode,
        initials: name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2) };
      state.users[idx] = updated;
      if (!DEMO_MODE && db) {
        try {
          await fbSetDoc(fbDoc(db, 'users', id), updated);
          console.log('User updated in Firestore:', id);
        } catch(e) { console.error('User update failed:', e); showToast('Save failed: ' + e.message); return; }
      }
    }
    showToast('User updated');
  } else {
    const pinEl = document.getElementById('u-pin');
    const pin = pinEl ? pinEl.value : '0000';
    if (pin.length !== 4 || !/^\d{4}$/.test(pin)) { showToast('PIN must be 4 digits'); return; }
    if (state.users.find(u => u.pin === pin)) { showToast('PIN already in use'); return; }
    const newId = 'u' + Date.now();
    const newUser = {
      id: newId, name, role, pin, phone, email, address, city, postcode,
      initials: name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2),
      color: colors[state.users.length % colors.length],
      hourly_rate: null, active: true
    };
    state.users.push(newUser);
    if (!DEMO_MODE && db) {
      try {
        await fbSetDoc(fbDoc(db, 'users', newId), newUser);
        console.log('New user saved to Firestore:', newId);
      } catch(e) { console.error('User save failed:', e); showToast('Save failed: ' + e.message); return; }
    }
    showToast('User added');
  }
  closeModal();
  render();
};

window.removeUser = async (id) => {

window.doAdminResetPin = async (uid) => {
  const pin = document.getElementById('new-pin-reset').value.trim();
  if (!/^\d{4}$/.test(pin)) {
    document.getElementById('reset-pin-error').textContent = 'PIN must be exactly 4 digits';
    return;
  }
  if (state.users.find(u => u.id !== uid && u.pin === pin)) {
    document.getElementById('reset-pin-error').textContent = 'PIN already in use';
    return;
  }
  const idx = state.users.findIndex(u => u.id === uid);
  if (idx >= 0) {
    state.users[idx].pin = pin;
    if (!DEMO_MODE && db) {
      try {
        await fbUpdateDoc(fbDoc(db, 'users', uid), { pin });
        console.log('PIN reset in Firestore:', uid);
      } catch(e) { console.error('PIN reset failed:', e); showToast('Reset failed: ' + e.message); return; }
    }
  }
  showToast('PIN reset successfully');
  closeModal();

window.doChangePin = async () => {
  const old = document.getElementById('pin-old').value;
  const newPin = document.getElementById('pin-new').value;
  const confirm2 = document.getElementById('pin-confirm').value;
  const errEl = document.getElementById('pin-change-error');

  if (old !== state.currentUser.pin) { errEl.textContent = 'Current PIN is incorrect'; return; }
  if (!/^\d{4}$/.test(newPin)) { errEl.textContent = 'New PIN must be 4 digits'; return; }
  if (newPin !== confirm2) { errEl.textContent = 'PINs do not match'; return; }
  if (state.users.find(u => u.id !== state.currentUser.id && u.pin === newPin)) {
    errEl.textContent = 'PIN already in use'; return;
  }
  const idx = state.users.findIndex(u => u.id === state.currentUser.id);
  if (idx >= 0) {
    state.users[idx].pin = newPin;
    state.currentUser.pin = newPin;
    if (!DEMO_MODE && db) {
      try {
        await fbUpdateDoc(fbDoc(db, 'users', state.currentUser.id), { pin: newPin });
        console.log('PIN changed in Firestore:', state.currentUser.id);
      } catch(e) { console.error('PIN change failed:', e); showToast('Save failed: ' + e.message); return; }
    }
  }
  showToast('PIN changed successfully');
  closeModal();
};

window.exportPDF = (type) => {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const u = state.currentUser;
  const now = new Date();
  const m = state.reportMonth, y = state.reportYear;

  // Header
  doc.setFillColor(124, 92, 191);
  doc.rect(0, 0, 210, 28, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(18);
  doc.setFont('helvetica', 'bold');
  doc.text('TimeShift', 14, 14);
  doc.setFontSize(10);
  doc.setFont('helvetica', 'normal');

  let title = '', entries = [];

  if (type === 'week') {
    const week = getWeekBounds(now);
    title = `Week: ${week.start.toLocaleDateString('en-GB')} – ${week.end.toLocaleDateString('en-GB')}`;
    entries = state.entries.filter(e => {
      if (e.user_id !== u.id) return false;
      const d = parseDate(e.date);
      return d >= week.start && d <= week.end;
    }).sort((a,b)=>a.date.localeCompare(b.date));
  } else if (type === 'month') {
    title = `${MONTH_NAMES[m]} ${y}`;
    entries = state.entries.filter(e => {
      if (e.user_id !== u.id) return false;
      const d = parseDate(e.date);
      return d.getMonth() === m && d.getFullYear() === y;
    }).sort((a,b)=>a.date.localeCompare(b.date));
  } else {
    title = `Year ${y}`;
    entries = state.entries.filter(e => e.user_id === u.id && parseDate(e.date).getFullYear() === y)
      .sort((a,b)=>a.date.localeCompare(b.date));
  }

  doc.text(`${title} · ${u.name} · Generated ${now.toLocaleDateString('en-GB')}`, 14, 22);
  doc.setTextColor(0,0,0);

  const total = sumMins(entries);
  const h = Math.floor(total/60), mins = total%60;

  doc.setFontSize(12);
  doc.setFont('helvetica','bold');
  doc.text(`Total: ${h}h ${mins}m`, 14, 36);
  doc.setFont('helvetica','normal');
  doc.setFontSize(10);
  doc.text(`${entries.length} days worked`, 14, 42);

  doc.autoTable({
    startY: 48,
    head: [['Date','Shift 1','Shift 2','Shift 3','Total','Note']],
    body: entries.map(e => [
      displayDate(e.date),
      e.shifts[0] ? `${e.shifts[0].start}–${e.shifts[0].end}` : '',
      e.shifts[1] ? `${e.shifts[1].start}–${e.shifts[1].end}` : '',
      e.shifts[2] ? `${e.shifts[2].start}–${e.shifts[2].end}` : '',
      formatMins(e.total_mins),
      e.note || ''
    ]),
    headStyles: { fillColor: [255,107,138], textColor: 255, fontStyle: 'bold' },
    alternateRowStyles: { fillColor: [253,245,255] },
    styles: { fontSize: 9 },
  });

  doc.save(`TimeShift_${u.name.replace(' ','_')}_${title.replace(' ','_')}.pdf`);
  showToast('PDF exported');
};

window.exportAdminPDF = () => {

    startY += 4;

    doc.autoTable({
      startY,
      head: [['Date','Shifts','Total','Note']],
      body: ue.map(e => [
        displayDate(e.date),
        e.shifts.map(s=>`${s.start}–${s.end}`).join(', '),
        formatMins(e.total_mins),
        e.note || ''
      ]),
      headStyles: { fillColor: [255,107,138], textColor:255 },
      alternateRowStyles: { fillColor: [253,245,255] },
      styles: { fontSize: 8 },
      margin: { left: 14, right: 14 }
    });

    startY = doc.lastAutoTable.finalY + 10;
  });

  doc.save(`TimeShift_Admin_${MONTH_SHORT[m]}${y}.pdf`);
  showToast('Admin PDF exported');
};

// ═══════════════════════════════════
// TOAST
// ═══════════════════════════════════
function showToast(msg) {
  state.toast = msg;
  render();
  setTimeout(() => { state.toast = null; render(); }, 2500);
}

// ═══════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════
function render() {
  const app = document.getElementById('app');

  // Loading overlay
  if (state.loading) {
    app.innerHTML = `<div class="offline-screen">
      ${logoSVG(56)}
      <h2 style="margin-top:16px;">Loading…</h2>
      <p>Connecting to Firebase</p>
    </div>`;
    return;
  }

  // Offline blocker — always shown if offline (except on pin screen during first load)
  if (state.online === false) {
    app.innerHTML = `<div class="offline-screen">
      ${logoSVG(64)}
      <h2>No Connection</h2>
      <p>TimeShift requires an internet connection.<br/>Please check your connection and try again.</p>
      <button class="btn btn-primary" onclick="checkOnline()">${icons.refresh} Try Again</button>
    </div>`;
    return;
  }

  if (state.screen === 'pin') {
    app.innerHTML = renderPin();
    return;
  }

  let screenContent = '';
  switch (state.screen) {
    case 'home': screenContent = renderHome(); break;
    case 'log': screenContent = renderLog(); break;
    case 'entries': screenContent = renderEntries(); break;
    case 'reports': screenContent = renderReports(); break;
    case 'users': screenContent = renderUsers(); break;
    case 'admin-reports': screenContent = renderAdminReports(); break;
    case 'settings': screenContent = renderSettings(); break;
    default: screenContent = renderHome();
  }

  app.innerHTML = `
    ${renderTopbar()}
    <div class="screen">${screenContent}</div>
    ${renderNav()}
    ${renderModal()}
    ${renderProfileMenu()}
    ${state.toast ? `<div class="toast">${state.toast}</div>` : ''}
  `;
}

// ═══════════════════════════════════
// FIREBASE CONFIG ACTIONS
// ═══════════════════════════════════
window.saveFirebaseConfig = async function() {
  const apiKey    = document.getElementById('fb-apikey').value.trim();
  const projectId = document.getElementById('fb-projectid').value.trim();
  const appId     = document.getElementById('fb-appid').value.trim();
  if (!apiKey || !projectId || !appId) { showToast('All three fields are required'); return; }
  const cfg = {
    apiKey,
    projectId,
    appId,
    authDomain: `${projectId}.firebaseapp.com`,
    storageBucket: `${projectId}.appspot.com`,
    messagingSenderId: '',
  };
  localStorage.setItem('ts_firebase', JSON.stringify(cfg));
  showToast('Saved — connecting to Firebase…');
  await initFirebase();
  if (!DEMO_MODE && db) {
    await loadFirebaseData();
    showToast('Firebase connected ✓');
  } else {
    showToast('Connection failed — check keys and retry');
  }
  render();
};

window.testFirebaseWrite = async function() {
  if (!db) { showToast('db is null — Firebase not initialised'); return; }
  try {
    const testId = 'test_' + Date.now();
    await fbSetDoc(fbDoc(db, '_test', testId), { ts: new Date().toISOString(), ok: true });
    state.fbStatus = 'Test write succeeded ✓ — Firebase is working';
    showToast('Test write OK ✓');
    render();
  } catch(e) {
    state.fbStatus = 'Test write FAILED: ' + e.message;
    showToast('Write failed: ' + e.message);
    render();
  }
};

window.clearFirebaseConfig = function() {
  if (!confirm('Clear Firebase config? App will return to demo mode.')) return;
  localStorage.removeItem('ts_firebase');
  db = null; fbApp = null; DEMO_MODE = true;
  initDemoData();
  showToast('Cleared — running in demo mode');
  render();
};

// Load all users and entries from Firestore into state
async function loadFirebaseData() {
  if (!db) return;
  try {
    state.loading = true; render();
    const [uSnap, eSnap] = await Promise.all([
      fbGetDocs(fbCollection(db, 'users')),
      fbGetDocs(fbCollection(db, 'entries'))
    ]);
    state.users   = uSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.entries = eSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.loading = false;
    console.log('Loaded from Firestore:', state.users.length, 'users,', state.entries.length, 'entries');
  } catch(e) {
    state.loading = false;
    console.error('loadFirebaseData failed:', e);
    showToast('Failed to load data: ' + e.message);
  }
}

// ═══════════════════════════════════
// CONNECTIVITY
// ═══════════════════════════════════
window.checkOnline = function() {
  state.online = null;
  render();
  // Fetch a tiny resource to confirm real connectivity
  fetch('https://www.gstatic.com/generate_204', { mode: 'no-cors', cache: 'no-store' })
    .then(() => { state.online = true; render(); })
    .catch(() => { state.online = false; render(); });
};

window.refreshApp = function() {
  checkOnline();
  showToast('Refreshed');
};

window.exitApp = function() {
  if (confirm('Exit TimeShift?')) {
    logout();
  }
};

window.addEventListener('online',  () => { state.online = true;  render(); });
window.addEventListener('offline', () => { state.online = false; render(); });

// ═══════════════════════════════════
// INIT
// ═══════════════════════════════════
async function init() {
  initDemoData();          // always load demo data as baseline
  await initFirebase();    // attempt Firebase connection
  if (!DEMO_MODE && db) {
    await loadFirebaseData(); // replace demo data with live data
  }
  checkOnline();           // sets state.online then calls render()
}
init();
</script>
</body>
