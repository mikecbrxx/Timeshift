<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="theme-color" content="#FF6B8A"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="TimeShift"/>
<title>TimeShift</title>
<link rel="manifest" href="./manifest.json"/>
<link rel="apple-touch-icon" href="./apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<!-- Firebase SDK — loaded as regular scripts, no dynamic import needed -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root {
    --coral: #FF6B8A;
    --coral-light: #FF8FA3;
    --coral-dark: #E84D6F;
    --violet: #7C5CBF;
    --violet-light: #9B7FD4;
    --violet-dark: #5E3FA3;
    --teal: #00B4C5;
    --teal-light: #33C9D8;
    --amber: #FFB347;
    --green: #52C97E;
    --bg: #FBF7FF;
    --bg2: #F3EEF9;
    --card: #FFFFFF;
    --text: #2D2040;
    --text2: #6B5B8A;
    --text3: #A89BC2;
    --border: #E8DFF5;
    --shadow: 0 4px 24px rgba(124,92,191,0.10);
    --shadow-lg: 0 8px 40px rgba(124,92,191,0.16);
    --radius: 18px;
    --radius-sm: 10px;
    --font-head: 'Sora', sans-serif;
    --font-body: 'Nunito', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  /* Global SVG size cap — prevents unsized inline SVG icons from ballooning */
  svg { width: 14px; height: 14px; flex-shrink: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
  }
  #app { height: 100%; display: flex; flex-direction: column; }

  /* ── SCROLLABLE CONTENT ── */
  .screen { flex: 1; overflow-y: auto; padding: 0 0 72px; }
  .screen::-webkit-scrollbar { width: 4px; }
  .screen::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── TOP BAR ── */
  .topbar {
    background: white;
    border-bottom: 1.5px solid var(--border);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(124,92,191,0.07);
  }
  .topbar-logo { display: flex; align-items: center; gap: 10px; }
  .topbar-logo svg { width: 26px; height: 26px; }
  .topbar-title { font-family: var(--font-head); font-weight: 700; font-size: 15px; color: var(--violet-dark); }
  .topbar-sub { font-size: 11px; color: var(--text3); font-weight: 500; }
  .topbar-user { display: flex; align-items: center; gap: 8px; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--coral), var(--violet));
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 10px;
    font-family: var(--font-head);
    cursor: pointer; flex-shrink: 0;
  }

  /* ── OFFLINE BANNER ── */
  .offline-banner {
    background: #2D2040; color: white;
    text-align: center; padding: 8px 16px;
    font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    flex-shrink: 0; z-index: 50;
    animation: fadeIn 0.3s ease;
  }
  .offline-banner svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* ── OFFLINE BLOCKER ── */
  .offline-screen {
    position: fixed; inset: 0;
    background: linear-gradient(160deg, var(--violet-dark) 0%, #3A1F7A 40%, #1A0F3E 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 250; padding: 40px 30px; text-align: center;
  }
  .offline-screen h2 { font-family: var(--font-head); font-weight: 800; font-size: 24px; color: white; margin: 20px 0 10px; }
  .offline-screen p { color: rgba(255,255,255,0.65); font-size: 14px; margin-bottom: 28px; }

  /* ── TRAFFIC LIGHT ── */
  .traffic-light {
    display: flex; align-items: center; gap: 6px;
    margin-left: 4px;
  }
  .tl-dot {
    width: 10px; height: 10px; border-radius: 50%;
    transition: background 0.4s, box-shadow 0.4s;
    flex-shrink: 0;
  }
  .tl-dot.online  { background: #52C97E; box-shadow: 0 0 6px #52C97E; }
  .tl-dot.offline { background: #FF4D4D; box-shadow: 0 0 6px #FF4D4D; }
  .tl-dot.checking { background: var(--amber); box-shadow: 0 0 6px var(--amber); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

  /* ── TOPBAR ACTIONS ── */
  .topbar-actions { display: flex; align-items: center; gap: 6px; }
  .topbar-btn {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--bg2); border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text2); flex-shrink: 0;
    transition: background 0.15s, color 0.15s;
  }
  .topbar-btn:hover { background: var(--border); color: var(--text); }
  .topbar-btn svg { width: 13px; height: 13px; }
  .topbar-btn.back { color: var(--violet); }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    background: white;
    border-top: 1.5px solid var(--border);
    display: flex;
    padding: 0;
    flex-shrink: 0;
    box-shadow: 0 -2px 16px rgba(124,92,191,0.08);
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 7px 4px 5px;
    cursor: pointer; border: none; background: none;
    color: var(--text3); transition: color 0.2s;
    font-family: var(--font-body);
    position: relative; font-size: 9px;
  }
  .nav-btn.active { color: var(--coral); }
  .nav-btn svg { width: 17px; height: 17px; margin-bottom: 2px; }
  .topbar-logo svg { width: 26px !important; height: 26px !important; }
  .topbar-btn svg { width: 13px !important; height: 13px !important; }
  .empty svg { width: 36px !important; height: 36px !important; }
  .pin-logo svg { width: 64px !important; height: 64px !important; }
  .offline-screen svg.logo { width: 64px !important; height: 64px !important; }
  .modal-close svg { width: 14px !important; height: 14px !important; }
  .profile-menu-item svg { width: 14px !important; height: 14px !important; }
  .user-card-info svg { width: 12px !important; height: 12px !important; }
  .btn svg { width: 12px !important; height: 12px !important; }
  .btn-sm svg { width: 11px !important; height: 11px !important; }
  .stat-card svg { width: 12px !important; height: 12px !important; }
  .entry-item svg { width: 12px !important; height: 12px !important; }
  .tl-dot { flex-shrink: 0; }
  svg.logo-svg { width: auto !important; height: auto !important; }
  .nav-btn span { font-size: 9px; font-weight: 600; letter-spacing: 0.3px; }
  .nav-btn.active::after {
    content: '';
    position: absolute; top: 0; left: 20%; right: 20%;
    height: 3px; background: var(--coral); border-radius: 0 0 4px 4px;
  }

  /* ── CARDS ── */
  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); border: 1.5px solid var(--border);
    padding: 12px 14px;
  }
  .card-sm { padding: 8px 12px; border-radius: var(--radius-sm); }

  /* ── SECTION HEADER ── */
  .section-head {
    padding: 10px 14px 6px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-head h2 {
    font-family: var(--font-head); font-weight: 700; font-size: 14px; color: var(--text);
  }
  .section-head .sub { font-size: 10px; color: var(--text3); margin-top: 1px; }

  /* ── STAT CARDS ── */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 14px; }
  .stat-card {
    border-radius: var(--radius-sm); padding: 10px 12px;
    position: relative; overflow: hidden;
  }
  .stat-card .label { font-size: 9px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; opacity: 0.75; margin-bottom: 3px; }
  .stat-card .value { font-family: var(--font-head); font-weight: 800; font-size: 16px; line-height: 1; }
  .stat-card .sub-val { font-size: 9px; margin-top: 3px; opacity: 0.7; }
  .stat-card .blob {
    position: absolute; right: -10px; bottom: -10px;
    width: 60px; height: 60px; border-radius: 50%;
    opacity: 0.15;
  }
  .stat-coral { background: linear-gradient(135deg, #FF6B8A, #FF8FA3); color: white; }
  .stat-violet { background: linear-gradient(135deg, #7C5CBF, #9B7FD4); color: white; }
  .stat-teal { background: linear-gradient(135deg, #00B4C5, #33C9D8); color: white; }
  .stat-amber { background: linear-gradient(135deg, #FFB347, #FFC97A); color: white; }
  .stat-green { background: linear-gradient(135deg, #52C97E, #7DDEA0); color: white; }

  /* ── TODAY HERO ── */
  .today-hero {
    margin: 8px 14px 0;
    background: linear-gradient(135deg, var(--violet-dark) 0%, var(--coral) 100%);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    color: white;
    position: relative;
    overflow: hidden;
  }
  .today-hero::before {
    content: '';
    position: absolute; top: -30px; right: -20px;
    width: 120px; height: 120px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .today-hero::after {
    content: '';
    position: absolute; bottom: -40px; left: 30px;
    width: 90px; height: 90px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .today-hero .date-label { font-size: 10px; font-weight: 600; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.5px; }
  .today-hero .hours-big { font-family: var(--font-head); font-weight: 800; font-size: 32px; line-height: 1; margin: 3px 0 2px; }
  .today-hero .shifts-label { font-size: 10px; opacity: 0.75; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 8px 14px; border-radius: 50px; border: none; cursor: pointer;
    font-family: var(--font-body); font-weight: 700; font-size: 12px;
    transition: all 0.18s; text-decoration: none;
  }
  .btn-primary { background: linear-gradient(135deg, var(--coral), var(--coral-dark)); color: white; box-shadow: 0 4px 16px rgba(255,107,138,0.35); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,107,138,0.45); }
  .btn-secondary { background: var(--bg2); color: var(--violet-dark); border: 1.5px solid var(--border); }
  .btn-violet { background: linear-gradient(135deg, var(--violet), var(--violet-dark)); color: white; box-shadow: 0 4px 16px rgba(124,92,191,0.30); }
  .btn-teal { background: linear-gradient(135deg, var(--teal), #0099A8); color: white; }
  .btn-danger { background: #FFE8EE; color: #D63360; border: 1.5px solid #FFCCD8; }
  .btn-sm { padding: 5px 10px; font-size: 11px; }
  .btn-icon { padding: 6px; border-radius: 8px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-full { width: 100%; }

  /* ── FORMS ── */
  .form-group { margin-bottom: 8px; }
  .form-group label { display: block; font-size: 10px; font-weight: 700; color: var(--text2); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.4px; }
  .form-group input, .form-group select {
    width: 100%; padding: 7px 10px; border-radius: var(--radius-sm);
    border: 1.5px solid var(--border); background: var(--bg);
    font-family: var(--font-body); font-size: 13px; color: var(--text);
    outline: none; transition: border-color 0.18s;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--violet-light); background: white; }
  .form-group .hint { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(44,32,64,0.45);
    backdrop-filter: blur(4px);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 100;
    animation: fadeIn 0.18s ease;
  }
  .modal {
    background: white; width: 100%; max-width: 480px;
    border-radius: 24px 24px 0 0;
    padding: 16px 16px 24px;
    animation: slideUp 0.22s ease;
    max-height: 92vh; overflow-y: auto;
  }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .modal-title { font-family: var(--font-head); font-weight: 700; font-size: 14px; color: var(--text); }
  .modal-close { width: 32px; height: 32px; border-radius: 50%; background: var(--bg2); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text2); font-size: 18px; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  /* ── PIN SCREEN ── */
  .pin-screen {
    position: fixed; inset: 0;
    background: linear-gradient(160deg, var(--violet-dark) 0%, #3A1F7A 40%, #1A0F3E 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 200; padding: 40px 30px;
  }
  .pin-logo { margin-bottom: 32px; }
  .pin-title { font-family: var(--font-head); font-weight: 800; font-size: 28px; color: white; margin-bottom: 6px; text-align: center; }
  .pin-subtitle { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 36px; text-align: center; }
  .pin-dots { display: flex; gap: 14px; margin-bottom: 36px; }
  .pin-dot {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.4);
    transition: all 0.15s;
  }
  .pin-dot.filled { background: var(--coral); border-color: var(--coral); transform: scale(1.1); }
  .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 280px; }
  .pin-key {
    height: 64px; border-radius: 16px;
    background: rgba(255,255,255,0.10);
    border: 1.5px solid rgba(255,255,255,0.15);
    color: white; font-family: var(--font-head); font-weight: 700; font-size: 22px;
    cursor: pointer; transition: all 0.12s;
    display: flex; align-items: center; justify-content: center;
  }
  .pin-key:active { transform: scale(0.94); background: rgba(255,255,255,0.22); }
  .pin-key.del { font-size: 16px; color: rgba(255,255,255,0.7); }
  .pin-key.empty { background: transparent; border-color: transparent; cursor: default; }
  .pin-error { color: var(--coral-light); font-size: 13px; margin-bottom: 12px; text-align: center; min-height: 20px; }
  .pin-switch { color: rgba(255,255,255,0.55); font-size: 13px; margin-top: 20px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  /* ── SHIFT ENTRY ── */
  .shift-row {
    background: var(--bg); border-radius: var(--radius-sm);
    padding: 7px 10px; margin-bottom: 6px;
    border: 1.5px solid var(--border);
  }
  .shift-row-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
  .shift-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px;
  }
  .badge-1 { background: #FFE8EE; color: #D63360; }
  .badge-2 { background: #EDE6FF; color: #5E3FA3; }
  .badge-3 { background: #E0F7FA; color: #006064; }
  .shift-duration { font-family: var(--font-head); font-weight: 700; font-size: 12px; color: var(--violet); }

  /* ── ENTRY LIST ── */
  .entry-item {
    padding: 8px 10px; border-radius: var(--radius-sm);
    background: white; border: 1.5px solid var(--border);
    margin-bottom: 6px; cursor: pointer;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .entry-item:hover { box-shadow: var(--shadow); border-color: var(--violet-light); }
  .entry-item-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
  .entry-date { font-weight: 700; font-size: 12px; color: var(--text); }
  .entry-total { font-family: var(--font-head); font-weight: 800; font-size: 13px; color: var(--coral); }
  .entry-shifts { font-size: 10px; color: var(--text3); }
  .entry-actions { display: flex; gap: 6px; margin-top: 6px; }

  /* ── REPORT ── */
  .report-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 20px 16px; }
  .report-cell { background: var(--bg2); border-radius: var(--radius-sm); padding: 12px 10px; text-align: center; }
  .report-cell .rc-label { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
  .report-cell .rc-val { font-family: var(--font-head); font-weight: 800; font-size: 17px; color: var(--violet-dark); }

  /* ── USERS ── */
  .user-card {
    background: white; border-radius: var(--radius); border: 1.5px solid var(--border);
    box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px;
    overflow: hidden; position: relative;
  }
  .user-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .user-card-avatar {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-head); font-weight: 800; font-size: 13px; color: white;
  }
  .user-card-name { font-weight: 700; font-size: 13px; color: var(--text); }
  .user-card-role { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; display: inline-block; margin-top: 2px; }
  .role-admin { background: #EDE6FF; color: var(--violet-dark); }
  .role-user { background: #FFE8EE; color: var(--coral-dark); }
  .user-card-info { font-size: 11px; color: var(--text2); line-height: 1.6; }
  .user-card-info span { display: flex; align-items: center; gap: 5px; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: white; padding: 10px 20px;
    border-radius: 50px; font-size: 13px; font-weight: 600;
    z-index: 300; animation: fadeIn 0.2s ease;
    white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }

  /* ── TABS ── */
  .tab-row { display: flex; gap: 6px; padding: 0 14px 10px; overflow-x: auto; }
  .tab-row::-webkit-scrollbar { display: none; }
  .tab-pill {
    padding: 5px 12px; border-radius: 50px; font-size: 11px; font-weight: 700;
    border: 1.5px solid var(--border); background: white; color: var(--text2);
    cursor: pointer; white-space: nowrap; transition: all 0.15s;
  }
  .tab-pill.active { background: var(--violet); color: white; border-color: var(--violet); }

  /* ── DIVIDER ── */
  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  /* ── EMPTY ── */
  .empty { text-align: center; padding: 24px 14px; color: var(--text3); }
  .empty svg { width: 36px; height: 36px; margin-bottom: 8px; opacity: 0.4; }
  .empty p { font-size: 14px; }

  /* ── CHIP ── */
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .chip-green { background: #E6F9EF; color: #1A7A42; }
  .chip-red { background: #FFE8EE; color: #D63360; }
  .chip-amber { background: #FFF4E5; color: #A05A00; }

  /* ── MISC ── */
  .page-pad { padding: 0 14px; }
  .mt-4 { margin-top: 10px; }
  .mb-4 { margin-bottom: 10px; }
  .flex-row { display: flex; align-items: center; gap: 10px; }
  .flex-between { display: flex; align-items: center; justify-content: space-between; }
  .text-sm { font-size: 13px; }
  .text-xs { font-size: 11px; }
  .text-muted { color: var(--text3); }
  .text-violet { color: var(--violet); }
  .text-coral { color: var(--coral); }
  .fw-700 { font-weight: 700; }
  .fw-800 { font-weight: 800; font-family: var(--font-head); }
  .hidden { display: none !important; }
  select option { font-family: var(--font-body); }

  /* ── PROFILE MENU ── */
  .profile-menu {
    position: fixed; top: 48px; right: 12px;

// ═══════════════════════════════════
// EARNINGS HELPERS
// ═══════════════════════════════════
function getRateForDate(user, dateStr) {
  // Returns the hourly_rate for a given date, or null if none applies
  if (!user.rates || !user.rates.length) return null;
  return user.rates.find(r => dateStr >= r.from_date && dateStr <= r.to_date) || null;
}

function calcEarnings(totalMins, rate) {
  if (!rate) return null;
  return (totalMins / 60) * rate.hourly_rate;
}

function fmtCurrency(amount) {
  if (amount === null || amount === undefined) return '—';
  return '£' + amount.toFixed(2);
}

function calcPeriodEarnings(entries, user) {
  // Returns { total: number|null, hasRates: bool, unrated: number }
  if (!user.rates || !user.rates.length) return { total: null, hasRates: false, unrated: entries.length };
  let total = 0, unrated = 0;
  entries.forEach(e => {
    const rate = getRateForDate(user, e.date);
    if (rate) {
      total += calcEarnings(e.total_mins, rate);
    } else {
      unrated++;
    }
  });
  return { total, hasRates: true, unrated };
}

function validateRate(newRate, existingRates, excludeId) {
  // Returns null if valid, error string if not
  const others = (existingRates || []).filter(r => r.id !== excludeId);
  if (!newRate.from_date || !newRate.to_date) return 'Both dates are required';
  if (newRate.from_date > newRate.to_date) return 'End date must be after start date';
  if (!newRate.hourly_rate || newRate.hourly_rate <= 0) return 'Hourly rate must be greater than zero';
  const today = new Date().toISOString().slice(0,10);
  const isFuture = newRate.from_date > today;
  const futureRates  = others.filter(r => r.from_date > today);
  const currentRates = others.filter(r => r.from_date <= today);

  if (isFuture && futureRates.length >= 1)
    return 'Only 1 future rate allowed. Delete the existing future rate first.';
  if (!isFuture && currentRates.length >= 3)
    return 'Maximum 3 current/past rates per person. Delete one to add another.';

  // Check for overlaps across all others
  for (const r of others) {
    const overlap = newRate.from_date <= r.to_date && newRate.to_date >= r.from_date;
    if (overlap) return `Overlaps with existing rate (${r.from_date} – ${r.to_date})`;
  }
  return null;
}

function autoEndDate(fromDate) {
  // Auto-set to_date to from_date + 2 years
  const d = new Date(fromDate);
  d.setFullYear(d.getFullYear() + 2);
  return d.toISOString().slice(0, 10);
}

// ═══════════════════════════════════
// TIME HELPERS
// ═══════════════════════════════════
function parseTime(str) { // "HH:MM" -> minutes from midnight
  const [h, m] = str.split(':').map(Number);
  return h * 60 + m;
}

function formatMins(mins) { // 90 -> "1h 30m"
  if (mins <= 0) return '0h 0m';
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

function roundShift(startMins, endMins) {
  // Handle overnight
  if (endMins <= startMins) endMins += 24 * 60;
  const raw = endMins - startMins;
  return Math.round(raw / 5) * 5;
}

function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

function parseDate(str) { // "YYYY-MM-DD"
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function displayDate(str) {
  const d = parseDate(str);
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}

function displayDateShort(str) {
  const d = parseDate(str);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

function todayStr() { return formatDate(new Date()); }

function getWeekBounds(d = new Date()) {
  const day = d.getDay(); // 0=Sun
  const diff = (day === 0 ? -6 : 1) - day; // Monday
  const mon = new Date(d); mon.setDate(d.getDate() + diff); mon.setHours(0,0,0,0);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6); sun.setHours(23,59,59,999);
  return { start: mon, end: sun };
}

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// ═══════════════════════════════════
// DATA ACCESS
// ═══════════════════════════════════
function userEntries(userId, entries) {
  return (entries || state.entries).filter(e => e.user_id === userId);
}

function entriesForPeriod(userId, filter) {
  const ue = userEntries(userId);
  return ue.filter(e => {
    const d = parseDate(e.date);
    if (filter.date) return e.date === filter.date;
    if (filter.month !== undefined) return d.getMonth() === filter.month && d.getFullYear() === filter.year;
    if (filter.year) return d.getFullYear() === filter.year;
    if (filter.weekStart) return d >= filter.weekStart && d <= filter.weekEnd;
    return true;
  });
}

function sumMins(entries) {
  return entries.reduce((a, e) => a + e.total_mins, 0);
}

function dashboardStats(userId) {
  const today = todayStr();
  const now = new Date();

  const todayEntries = entriesForPeriod(userId, { date: today });
  const todayMins = sumMins(todayEntries);

  // Last worked day
  const sorted = userEntries(userId).sort((a,b) => b.date.localeCompare(a.date));
  const lastEntry = sorted.find(e => e.date < today) || sorted[0];

  const week = getWeekBounds(now);
  const weekMins = sumMins(entriesForPeriod(userId, { weekStart: week.start, weekEnd: week.end }));

  const monthMins = sumMins(entriesForPeriod(userId, { month: now.getMonth(), year: now.getFullYear() }));
  const yearMins = sumMins(entriesForPeriod(userId, { year: now.getFullYear() }));

  return { todayMins, lastEntry, weekMins, monthMins, yearMins };
}

// ═══════════════════════════════════
// AUTH
// ═══════════════════════════════════
function tryLogin(pin) {
  const user = state.users.find(u => u.pin === pin && u.active);
  if (user) {
    state.currentUser = user;
    auditLog('LOGIN', 'User logged in');
    if (user.role === 'admin') { setTimeout(checkBackupReminder, 1500); setTimeout(checkYearEndReminder, 3000); }
    // Reload all data fresh from Firebase on every login
    if (!DEMO_MODE && db && state.online) {
      loadFirebaseData()
        .then(() => render())
        .catch(e => { console.error('Login reload failed:', e); render(); });
    }
    state.screen = 'home';
    state.pinInput = '';
    state.pinError = '';
    render();
  } else {
    state.pinError = 'Incorrect PIN. Please try again.';
    state.pinInput = '';
    render();
  }
}

function logout() {
  auditLog('LOGOUT', 'User logged out');
  state.currentUser = null;
  state.screen = 'pin';
  state.pinInput = '';
  state.pinError = '';
  state.profileMenu = false;
  render();
}

function renderEntries() {
  const u = state.currentUser;
  const year = state.entriesYear;
  const month = state.entriesMonth;

  const monthEntries = state.entries
    .filter(e => e.user_id === u.id)
    .filter(e => {
      const d = parseDate(e.date);
      return d.getMonth() === month && d.getFullYear() === year;
    })
    .sort((a,b) => b.date.localeCompare(a.date));

  const totalMins = sumMins(monthEntries);

  // Month nav
  const prevMonth = () => {
    let m = month - 1, y = year;
    if (m < 0) { m = 11; y--; }
    return { m, y };
  };
  const nextMonth = () => {
    let m = month + 1, y = year;
    if (m > 11) { m = 0; y++; }
    return { m, y };
  };
  const next = nextMonth();
  const prev = prevMonth();
  const isThisMonthOrFuture = (year > new Date().getFullYear()) ||
    (year === new Date().getFullYear() && month >= new Date().getMonth());

  const rows = monthEntries.map(e => {
    const shiftInfo = e.shifts.map((s,i) => `S${i+1}: ${s.start}–${s.end}`).join(' · ');
    return `<div class="entry-item">
      <div class="entry-item-top">
        <div>
          <div class="entry-date">${displayDate(e.date)}</div>
          <div class="entry-shifts">${shiftInfo}</div>
          ${e.note ? `<div class="text-xs text-muted" style="margin-top:3px;">${e.note}</div>` : ''}
        </div>
        <div class="entry-total">${formatMins(e.total_mins)}</div>
      </div>
      <div class="entry-actions">
        <button class="btn btn-secondary btn-sm" onclick="editEntry('${e.id}')">${icons.edit} Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteEntry('${e.id}')">${icons.trash} Delete</button>
      </div>
    </div>`;
  }).join('');

  return `
    <div class="section-head">
      <div><h2>Entries</h2><div class="sub">All your logged shifts</div></div>
    </div>
    <div class="flex-between page-pad mb-4" style="gap:6px;">
      <button class="btn btn-secondary btn-icon btn-sm" onclick="setEntriesMonth(${prev.m},${prev.y})">${icons.chevronLeft}</button>
      <select onchange="setEntriesMonth(this.value.split('-')[0]*1, this.value.split('-')[1]*1)"
        style="flex:1;padding:6px 8px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);font-family:var(--font-body);font-size:12px;font-weight:700;color:var(--text);">
        ${Array.from({length: (new Date().getFullYear() - 2023) * 12 + new Date().getMonth() + 1}, (_,i) => {
          const y = 2024 + Math.floor(i / 12);
          const m = i % 12;
          const sel = (m === month && y === year) ? 'selected' : '';
          return `<option value="${m}-${y}" ${sel}>${MONTH_SHORT[m]} ${y}</option>`;
        }).reverse().join('')}
      </select>
      <button class="btn btn-secondary btn-icon btn-sm" ${isThisMonthOrFuture ? 'disabled' : ''} onclick="setEntriesMonth(${next.m},${next.y})">${icons.chevronRight}</button>
    </div>
    ${totalMins > 0 ? `<div class="page-pad mb-4">
      <div class="card card-sm" style="background:linear-gradient(135deg,#F0EBFF,#FFE8EE);border-color:var(--violet-light);">
        <div class="flex-between">
          <span class="fw-700 text-muted text-sm">Month Total</span>
          <span class="fw-800 text-violet" style="font-size:14px;">${formatMins(totalMins)}</span>
        </div>
        <div class="text-xs text-muted mt-1">${monthEntries.length} day${monthEntries.length !== 1 ? 's' : ''} worked</div>
      </div>
    </div>` : ''}
    <div class="page-pad">
      ${rows || `<div class="empty">${icons.clock}<p>No entries for ${MONTH_SHORT[month]} ${year}</p></div>`}
    </div>
    <div style="height:20px;"></div>`;
}

// ── REPORTS ──
function renderReports() {
  const u = state.currentUser;
  const now = new Date();

  // ── Helper: earnings line ──
  function earningsLine(entries, user) {
    const ep = calcPeriodEarnings(entries, user);
    if (!ep.hasRates) return '';
    return `<div class="text-xs" style="color:#1A7A42;font-weight:700;margin-top:2px;">
      Earnings: ${fmtCurrency(ep.total)}${ep.unrated>0?` (${ep.unrated} unrated)`:''}
    </div>`;
  }

  // ── Helper: build HTML for on-screen report overlay ──
  function buildReportHTML(title, summaryHtml, rowsHtml) {
    return `<div style="font-size:12px;color:var(--text2);margin-bottom:10px;">${title}</div>
      ${summaryHtml}${rowsHtml}`;
  }

  // ── WEEK — shows day totals, tap day for shift detail ──
  function weekReport() {
    const week = getWeekBounds(now);
    const entries = state.entries.filter(e => {
      if (e.user_id !== u.id) return false;
      const d = parseDate(e.date);
      return d >= week.start && d <= week.end;
    }).sort((a,b) => a.date.localeCompare(b.date));
    const total = sumMins(entries);
    const weekLabel = `${week.start.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${week.end.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}`;

    const summaryHtml = `<div class="card card-sm mb-4" style="background:linear-gradient(135deg,#E0F7FA,#E8F5E9);">
      <div class="flex-between">
        <span class="fw-700" style="color:#00696F;">Week Total</span>
        <span class="fw-800 text-violet" style="font-size:14px;">${formatMins(total)}</span>
      </div>
      ${earningsLine(entries, u)}
      <div class="text-xs text-muted mt-1">${entries.length} days · ${weekLabel}</div>
    </div>`;

    const rowsHtml = entries.map(e => {
      const rate = getRateForDate(u, e.date);
      const earn = rate ? fmtCurrency(calcEarnings(e.total_mins, rate)) : '';
      return `<div class="entry-item" style="cursor:pointer;" onclick="showDayDetail('${e.id}')">
        <div class="flex-between">
          <div>
            <div class="fw-700 text-sm">${displayDate(e.date)}</div>
            <div class="text-xs text-muted">${e.shifts.map(s=>s.start+'–'+s.end).join(' · ')}</div>
          </div>
          <div style="text-align:right;">
            <div class="fw-800 text-coral">${formatMins(e.total_mins)}</div>
            ${earn?`<div class="text-xs" style="color:#1A7A42;font-weight:700;">${earn}</div>`:''}
          </div>
        </div>
      </div>`;
    }).join('') || `<div class="empty">${icons.chart}<p>No entries this week</p></div>`;

    return `<div class="page-pad">
      ${summaryHtml}${rowsHtml}
      <button class="btn btn-teal btn-full mt-4" onclick="showReportOverlay('Week ${weekLabel} — ${u.name}', ${JSON.stringify(buildReportHTML('Week ' + weekLabel, summaryHtml, rowsHtml))})">
        ${icons.chart} View &amp; Export Report
      </button>
    </div>`;
  }

  // ── MONTH — shows week totals, tap week to drill into days ──
  function monthReport() {
    const m = state.reportMonth, y = state.reportYear;
    const entries = state.entries.filter(e => {
      if (e.user_id !== u.id) return false;
      const d = parseDate(e.date);
      return d.getMonth() === m && d.getFullYear() === y;
    }).sort((a,b) => a.date.localeCompare(b.date));
    const total = sumMins(entries);
    const prev = m === 0 ? { m:11, y:y-1 } : { m:m-1, y };
    const next = m === 11 ? { m:0, y:y+1 } : { m:m+1, y };
    const isFuture = y > now.getFullYear() || (y === now.getFullYear() && m >= now.getMonth());

    // Group entries into ISO weeks
    function getISOWeek(dateStr) {
      const d = parseDate(dateStr);
      const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay()+6)%7));
      const sun = new Date(mon); sun.setDate(mon.getDate()+6);
      return { key: mon.toISOString().slice(0,10), start: mon, end: sun };
    }
    const weekMap = {};
    entries.forEach(e => {
      const wk = getISOWeek(e.date);
      if (!weekMap[wk.key]) weekMap[wk.key] = { start:wk.start, end:wk.end, entries:[] };
      weekMap[wk.key].entries.push(e);
    });
    const weeks = Object.values(weekMap).sort((a,b) => a.start - b.start);

    const summaryHtml = `<div class="card card-sm mb-4" style="background:linear-gradient(135deg,#FFF0F3,#F0EBFF);border-color:var(--coral-light);">
      <div class="flex-between">
        <span class="fw-700" style="color:var(--coral-dark);">Month Total</span>
        <span class="fw-800 text-violet" style="font-size:14px;">${formatMins(total)}</span>
      </div>
      ${earningsLine(entries, u)}
      <div class="text-xs text-muted mt-1">${entries.length} days worked</div>
    </div>`;

    const rowsHtml = weeks.map(wk => {
      const wkTotal = sumMins(wk.entries);
      const wkLabel = `${wk.start.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${wk.end.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}`;
      const wkEp = calcPeriodEarnings(wk.entries, u);
      return `<div class="entry-item" style="cursor:pointer;" onclick="drillWeek('${wk.start.toISOString().slice(0,10)}')">
        <div class="flex-between">
          <div>
            <div class="fw-700 text-sm">Week of ${wkLabel}</div>
            <div class="text-xs text-muted">${wk.entries.length} day${wk.entries.length!==1?'s':''} · tap for detail</div>
          </div>
          <div style="text-align:right;">
            <div class="fw-800 text-coral">${formatMins(wkTotal)}</div>
            ${wkEp.hasRates?`<div class="text-xs" style="color:#1A7A42;font-weight:700;">${fmtCurrency(wkEp.total)}</div>`:''}
          </div>
        </div>
      </div>`;
    }).join('') || `<div class="empty">${icons.chart}<p>No entries for ${MONTH_SHORT[m]} ${y}</p></div>`;

    return `<div class="page-pad">
      <div class="flex-between mb-4">
        <button class="btn btn-secondary btn-icon btn-sm" onclick="setReportMonth(${prev.m},${prev.y})">${icons.chevronLeft}</button>
        <span class="fw-700" style="font-size:13px;">${MONTH_NAMES[m]} ${y}</span>
        <button class="btn btn-secondary btn-icon btn-sm" ${isFuture?'disabled':''} onclick="setReportMonth(${next.m},${next.y})">${icons.chevronRight}</button>
      </div>
      ${summaryHtml}${rowsHtml}
      <button class="btn btn-teal btn-full mt-4" onclick="showReportOverlay('${MONTH_NAMES[m]} ${y} — ${u.name}', ${JSON.stringify(buildReportHTML(MONTH_NAMES[m] + ' ' + y, summaryHtml, rowsHtml))})">
        ${icons.chart} View &amp; Export Report
      </button>
    </div>`;
  }

  // ── YEAR — shows month totals, tap month to drill into weeks ──
  function yearReport() {
    const y = state.reportYear;
    const entries = state.entries.filter(e => e.user_id === u.id && parseDate(e.date).getFullYear() === y);
    const total = sumMins(entries);

    const summaryHtml = `<div class="card card-sm mb-4" style="background:linear-gradient(135deg,#FFF4E5,#FFE8EE);border-color:var(--amber);">
      <div class="flex-between">
        <span class="fw-700" style="color:#A05A00;">Year Total</span>
        <span class="fw-800 text-violet" style="font-size:14px;">${formatMins(total)}</span>
      </div>
      ${earningsLine(entries, u)}
      <div class="text-xs text-muted mt-1">${entries.length} days worked in ${y}</div>
    </div>`;

    const byMonth = Array.from({length:12}, (_,i) => {
      const me = entries.filter(e => parseDate(e.date).getMonth() === i);
      return { month:i, entries:me, mins:sumMins(me) };
    }).filter(mm => mm.mins > 0);

    const rowsHtml = byMonth.map(mm => {
      const mmEp = calcPeriodEarnings(mm.entries, u);
      return `<div class="entry-item" style="cursor:pointer;" onclick="drillMonth(${mm.month},${y})">
        <div class="flex-between">
          <div>
            <div class="fw-700 text-sm">${MONTH_NAMES[mm.month]}</div>
            <div class="text-xs text-muted">${mm.entries.length} day${mm.entries.length!==1?'s':''} · tap for weeks</div>
          </div>
          <div style="text-align:right;">
            <div class="fw-800 text-coral">${formatMins(mm.mins)}</div>
            ${mmEp.hasRates?`<div class="text-xs" style="color:#1A7A42;font-weight:700;">${fmtCurrency(mmEp.total)}</div>`:''}
          </div>
        </div>
      </div>`;
    }).join('') || `<div class="empty">${icons.chart}<p>No entries for ${y}</p></div>`;

    return `<div class="page-pad">
      <div class="flex-between mb-4">
        <button class="btn btn-secondary btn-icon btn-sm" onclick="setReportYear(${y-1})">${icons.chevronLeft}</button>
        <span class="fw-700" style="font-size:13px;">${y}</span>
        <button class="btn btn-secondary btn-icon btn-sm" ${y>=now.getFullYear()?'disabled':''} onclick="setReportYear(${y+1})">${icons.chevronRight}</button>
      </div>
      ${summaryHtml}${rowsHtml}
      <button class="btn btn-teal btn-full mt-4" onclick="showReportOverlay('${y} — ${u.name}', ${JSON.stringify(buildReportHTML(String(y), summaryHtml, rowsHtml))})">
        ${icons.chart} View &amp; Export Report
      </button>
    </div>`;
  }

  const tab = state.reportTab;
  return `
    <div class="section-head"><div><h2>Reports</h2><div class="sub">${u.role==='admin'?'Staff hours':'Your hours'}</div></div></div>
    ${u.role === 'admin' ? `
    <div class="tab-row" style="padding:0 14px 6px;">
      <div class="tab-pill ${state.reportViewMode==='own'?'active':''}" onclick="setReportViewMode('own')">My Hours</div>
      <div class="tab-pill ${state.reportViewMode!=='own'?'active':''}" onclick="setReportViewMode('staff')">Staff Hours</div>
    </div>` : ''}
    ${(u.role !== 'admin' || state.reportViewMode === 'own') ? `
    <div class="tab-row">
      <div class="tab-pill ${tab==='week'?'active':''}" onclick="setReportTab('week')">This Week</div>
      <div class="tab-pill ${tab==='month'?'active':''}" onclick="setReportTab('month')">Month</div>
      <div class="tab-pill ${tab==='year'?'active':''}" onclick="setReportTab('year')">Year</div>
    </div>
    ${tab === 'week' ? weekReport() : tab === 'month' ? monthReport() : yearReport()}
    ` : renderAdminReportsInline()}
    <div style="height:80px;"></div>`;
}

// ── ADMIN DRILL — full detail for one user ──
function renderAdminDrill() {
  const u = state.users.find(u => u.id === state.adminDrillUser);
  if (!u) return '<div class="empty">User not found</div>';

  const now = new Date();
  const tab = state.adminReportTab || 'month';
  const m = state.adminReportMonth, y = state.adminReportYear;
  const week = getWeekBounds(now);

  let entries = [];
  let periodLabel = '';

  if (tab === 'week') {
    entries = state.entries.filter(e => {
      if (e.user_id !== u.id) return false;
      const d = parseDate(e.date);
      return d >= week.start && d <= week.end;
    });
    periodLabel = `${week.start.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${week.end.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}`;
  } else if (tab === 'month') {
    entries = state.entries.filter(e => {
      if (e.user_id !== u.id) return false;
      const d = parseDate(e.date);
      return d.getMonth() === m && d.getFullYear() === y;
    });
    periodLabel = `${MONTH_NAMES[m]} ${y}`;
  } else {
    entries = state.entries.filter(e => e.user_id === u.id && parseDate(e.date).getFullYear() === y);
    periodLabel = `Year ${y}`;
  }

  entries.sort((a,b) => a.date.localeCompare(b.date));
  const total = sumMins(entries);

  // Group by month for year view
  const rows = tab === 'year'
    ? Array.from({length:12}, (_,i) => {
        const me = entries.filter(e => parseDate(e.date).getMonth() === i);
        if (!me.length) return '';
        return `<div style="margin-bottom:12px;">
          <div style="font-size:11px;font-weight:700;color:var(--violet);text-transform:uppercase;letter-spacing:0.5px;padding:4px 0;border-bottom:1px solid var(--border);margin-bottom:4px;">
            ${MONTH_NAMES[i]} — ${formatMins(sumMins(me))}
          </div>
          ${me.map(e => `<div class="entry-item" style="cursor:default;padding:7px 10px;margin-bottom:4px;">
            <div class="flex-between">
              <div>
                <div class="fw-700 text-sm">${displayDate(e.date)}</div>

                ${e.note?`<div class="text-xs text-muted">${e.note}</div>`:''}
              </div>
              <div class="fw-800 text-coral">${formatMins(e.total_mins)}</div>
            </div>
          </div>`).join('')}
        </div>`;
      }).join('')
    : entries.map(e => `<div class="entry-item" style="cursor:default;padding:7px 10px;margin-bottom:4px;">
        <div class="flex-between">
          <div>
            <div class="fw-700 text-sm">${displayDate(e.date)}</div>
            <div class="text-xs text-muted">${e.shifts.map((s,i)=>`S${i+1}: ${s.start}–${s.end}`).join(' · ')}</div>
            ${e.note?`<div class="text-xs text-muted">${e.note}</div>`:''}
          </div>
          <div class="fw-800 text-coral">${formatMins(e.total_mins)}</div>
        </div>
      </div>`).join('');

  return `
    <div class="section-head">
      <div>
        <h2>${u.name}</h2>
        <div class="sub">${periodLabel} · Detailed view</div>
      </div>
    </div>
    <div class="page-pad">
      <div class="card card-sm mb-4" style="background:linear-gradient(135deg,#EDE6FF,#FFE8EE);border-color:var(--violet-light);">
        <div class="flex-between">
          <div class="flex-row">
            <div class="user-card-avatar" style="width:36px;height:36px;font-size:13px;background:${u.color}">${u.initials}</div>
            <div>
              <div class="fw-700 text-sm">${u.name}</div>
              <div class="text-xs text-muted">${u.email || ''}</div>
            </div>
          </div>
          <div style="text-align:right;">
            <div class="fw-800 text-violet" style="font-size:18px;">${formatMins(total)}</div>
            ${(() => { const e = calcPeriodEarnings(entries, u); return e.hasRates ? `<div style="font-size:11px;color:#1A7A42;font-weight:700;">${fmtCurrency(e.total)}</div>` : ''; })()}
            <div class="text-xs text-muted">${entries.length} day${entries.length!==1?'s':''}</div>
          </div>
        </div>
      </div>
      ${rows || `<div class="empty">${icons.clock}<p>No entries for this period</p></div>`}
      <button class="btn btn-teal btn-full mt-4" onclick="exportDrillPDF()">${icons.download} Export PDF</button>
    </div>
    <div style="height:20px;"></div>`;
}

        ${ue.map(e => `<div class="flex-between" style="padding:4px 6px;font-size:11px;">

          <span class="fw-700 text-coral">${formatMins(e.total_mins)}</span>
        </div>`).join('')}
      </div>`;
    });
  } else if (tab === 'year') {
    // Year view — monthly breakdown per user
    usersToShow.forEach(u => {
      const ue = state.entries.filter(e => e.user_id === u.id && parseDate(e.date).getFullYear() === y);
      const total = sumMins(ue);
      grandTotal += total;
      const byMonth = Array.from({length:12}, (_,i) => {
        const me = ue.filter(e => parseDate(e.date).getMonth() === i);
        return { month: i, mins: sumMins(me), days: me.length };

        <div class="flex-between" style="padding:6px 0;border-bottom:1.5px solid var(--violet-light);margin-bottom:4px;cursor:pointer;" onclick="adminDrillInto('${u.id}')">

          <span style="color:var(--text3);">${mm.days} day${mm.days!==1?'s':''}</span>
          <span class="fw-700 text-coral">${formatMins(mm.mins)}</span>
        </div>`).join('') : '<div style="font-size:11px;color:var(--text3);padding:4px 6px;">No entries</div>'}
      </div>`;
    });
  }

  const weekLabel = `${week.start.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${week.end.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}`;
  const periodNav = tab === 'week' ? `
    <div class="card card-sm mb-4" style="background:var(--bg2);text-align:center;">
      <span class="fw-700 text-sm">${weekLabel}</span>
      <div class="text-xs text-muted mt-1">Mon – Sun · current week</div>
    </div>` :
  tab === 'month' ? `
    <div class="flex-between mb-4" style="gap:6px;">
      <button class="btn btn-secondary btn-icon btn-sm" onclick="setAdminMonth(${prev.m},${prev.y})">${icons.chevronLeft}</button>
      <span class="fw-700" style="font-size:13px;">${MONTH_NAMES[m]} ${y}</span>
      <button class="btn btn-secondary btn-icon btn-sm" ${isFuture?'disabled':''} onclick="setAdminMonth(${next.m},${next.y})">${icons.chevronRight}</button>
    </div>` : `
    <div class="flex-between mb-4" style="gap:6px;">
      <button class="btn btn-secondary btn-icon btn-sm" onclick="setAdminReportYear2(${y-1})">${icons.chevronLeft}</button>
      <span class="fw-700" style="font-size:13px;">${y}</span>
      <button class="btn btn-secondary btn-icon btn-sm" ${y>=now.getFullYear()?'disabled':''} onclick="setAdminReportYear2(${y+1})">${icons.chevronRight}</button>
    </div>`;

  return `
    <div class="section-head"><div><h2>Admin Reports</h2><div class="sub">Select staff and period</div></div></div>
    <div class="page-pad">
      <div class="card card-sm mb-4" style="background:var(--bg2);">
        <div class="flex-between" style="margin-bottom:8px;">
          <div>
            <span style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px;">Staff</span>
            <span id="admin-sel-count" style="font-size:10px;color:var(--text3);margin-left:6px;">${getAdminSelected().length} selected</span>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-secondary btn-sm" onclick="selectAllAdminUsers(true)">All</button>
            <button class="btn btn-secondary btn-sm" onclick="selectAllAdminUsers(false)">None</button>
            <button class="btn btn-primary btn-sm" onclick="applyAdminReport()">Apply</button>
          </div>
        </div>
        ${checkboxes}
      </div>
      <div class="tab-row" style="padding:0 0 10px;">
        <div class="tab-pill ${tab==='week'?'active':''}" onclick="setAdminReportTab('week')">This Week</div>
        <div class="tab-pill ${tab==='month'?'active':''}" onclick="setAdminReportTab('month')">Month</div>
        <div class="tab-pill ${tab==='year'?'active':''}" onclick="setAdminReportTab('year')">Year</div>
      </div>
      ${periodNav}
      <div class="card card-sm mb-4" style="background:linear-gradient(135deg,#EDE6FF,#FFE8EE);border-color:var(--violet-light);">
        <div class="flex-between">
          <span class="fw-700 text-violet">Combined Total</span>
          <span class="fw-800" style="font-size:14px;color:var(--coral-dark);">${formatMins(grandTotal)}</span>
        </div>
        ${(() => {
          let totalEarnings = 0, anyRates = false, totalUnrated = 0;
          usersToShow.forEach(u => {
            let ue;
            if (tab === 'week') ue = state.entries.filter(e => { if(e.user_id!==u.id)return false; const d=parseDate(e.date); return d>=week.start&&d<=week.end; });
            else if (tab === 'month') ue = state.entries.filter(e => { if(e.user_id!==u.id)return false; const d=parseDate(e.date); return d.getMonth()===m&&d.getFullYear()===y; });
            else ue = state.entries.filter(e => e.user_id===u.id && parseDate(e.date).getFullYear()===y);
            const ep = calcPeriodEarnings(ue, u);
            if (ep.hasRates) { anyRates = true; totalEarnings += ep.total; totalUnrated += ep.unrated; }
          });
          return anyRates ? `<div class="text-xs" style="color:#1A7A42;font-weight:700;margin-top:2px;">Combined Earnings: ${fmtCurrency(totalEarnings)}${totalUnrated>0?` (${totalUnrated} unrated days)`:''}</div>` : '';

}

      ENTRY_DELETE:'#FF6B8A', USER_ADD:'#7C5CBF', USER_EDIT:'#FFB347', USER_DELETE:'#FF6B8A',
      PIN_CHANGE:'#FFB347', PIN_RESET:'#FFB347', CONFIG_SAVE:'#7C5CBF',
      BACKUP_EXPORT:'#52C97E', BACKUP_RESTORE:'#FF6B8A', AUDIT_EXPORT:'#A89BC2'

// BACKUP & RESTORE SCREEN
// ═══════════════════════════════════
function renderBackup() {
  const now = new Date();
  const lastBackup = state.lastBackupDate
    ? (() => {
        const d = new Date(state.lastBackupDate);
        return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})
               + ' at ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      })()
    : 'Never';

  const daysSince = state.lastBackupDate
    ? Math.floor((now - new Date(state.lastBackupDate)) / 86400000)
    : null;

  const backupStatusColor = !state.lastBackupDate ? '#D63360'
    : daysSince > (state.backupReminderDays || 7) ? '#A05A00' : '#1A7A42';
  const backupStatusBg = !state.lastBackupDate ? 'linear-gradient(135deg,#FFE8EE,#FFF0F3)'
    : daysSince > (state.backupReminderDays || 7) ? 'linear-gradient(135deg,#FFF4E5,#FFF8EC)'
    : 'linear-gradient(135deg,#E6F9EF,#E0F7FA)';
  const backupStatusBorder = !state.lastBackupDate ? '#FFB3C6'
    : daysSince > (state.backupReminderDays || 7) ? '#FFB347' : '#52C97E';

  const stats = `${state.users.length} users · ${state.entries.length} entries · ${state.auditLog.length} audit entries`;

  return `
    <div class="section-head">
      <div><h2>Backup &amp; Restore</h2><div class="sub">Admin only</div></div>
    </div>
    <div class="page-pad">

      <div class="card card-sm mb-4" style="background:${backupStatusBg};border-color:${backupStatusBorder};">
        <div class="fw-700 text-sm" style="color:${backupStatusColor};">
          ${!state.lastBackupDate ? '⚠ No backup ever made' : daysSince === 0 ? '✓ Backed up today' : `Last backup: ${lastBackup}`}
        </div>
        <div class="text-xs text-muted mt-1">${stats}</div>
      </div>

      <button class="btn btn-primary btn-full mb-4" onclick="exportBackup()">
        ${icons.download} Export Backup Now
      </button>

      <div class="form-group mb-4" style="display:flex;align-items:flex-end;gap:10px;">
        <div style="flex:1;">
          <label>Backup reminder (days, 0 = off)</label>
          <input type="number" id="backup-days" min="0" max="365" value="${state.backupReminderDays}"/>
        </div>
        <button class="btn btn-secondary btn-sm" style="margin-bottom:1px;" onclick="saveBackupSettings()">Save</button>
      </div>

      <div class="card card-sm" style="background:var(--bg2);border-color:var(--border);">
        <div class="fw-700 text-sm" style="margin-bottom:6px;color:var(--coral-dark);">⚠ Restore from Backup</div>
        <div class="text-xs text-muted" style="margin-bottom:10px;line-height:1.7;">
          Overwrites ALL data in the app and Firestore. Use only to recover from a problem.
          Export a fresh backup first if in doubt.
        </div>
        <div class="form-group" style="margin-bottom:8px;">
          <label>Select backup JSON file</label>
          <input type="file" id="restore-file" accept=".json" style="font-size:12px;padding:6px 0;background:none;border:none;"/>
        </div>
        <div id="restore-progress" style="display:none;font-size:11px;color:var(--violet);margin-bottom:8px;font-weight:600;"></div>
        <button class="btn btn-danger btn-full" id="restore-btn" onclick="restoreBackup()">
          ⚠ Restore from File
        </button>
      </div>
    </div>
    <div style="height:20px;"></div>`;
}

// YEAR END & FREEZE SCREEN
// ═══════════════════════════════════
function renderFreeze() {
  const ye = state.yearEndSettings || { day:5, month:4 };
  const now = new Date();

  // Calculate last and next year end dates
  function getYearEnd(year) {
    return new Date(year, ye.month - 1, ye.day);
  }
  let lastYearEnd = getYearEnd(now.getFullYear());
  if (lastYearEnd > now) lastYearEnd = getYearEnd(now.getFullYear() - 1);
  const nextYearEnd = new Date(lastYearEnd);
  nextYearEnd.setFullYear(nextYearEnd.getFullYear() + 1);

  const lastYearEndStr = lastYearEnd.toISOString().slice(0,10);
  const isLastFrozen = state.freezePeriods.some(p => p.period_end === lastYearEndStr);

  // Build frozen periods list
  const frozenList = [...state.freezePeriods]
    .sort((a,b) => b.period_end.localeCompare(a.period_end))
    .map(p => {
      const frozenDate = new Date(p.frozen_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
      const totalEarnings = p.earnings_snapshot
        ? p.earnings_snapshot.reduce((a,s) => a + (s.earnings||0), 0)
        : null;
      return `<div class="card card-sm mb-4" style="background:linear-gradient(135deg,#E6F9EF,#E0F7FA);border-color:#52C97E;">
        <div class="flex-between" style="margin-bottom:4px;">
          <div>
            <span class="fw-700 text-sm">🔒 ${p.period_end}</span>
            <span class="chip chip-green" style="margin-left:6px;font-size:9px;">Frozen</span>
          </div>
          <button class="btn btn-secondary btn-sm" onclick="unfreezePeriod('${p.id}')">Unfreeze</button>
        </div>
        <div class="text-xs text-muted">Frozen ${frozenDate} by ${p.frozen_by}</div>
        ${totalEarnings !== null ? `<div class="text-xs" style="color:#1A7A42;font-weight:700;margin-top:2px;">Total earnings: ${fmtCurrency(totalEarnings)}</div>` : ''}
        ${p.override_reason ? `<div class="text-xs text-muted mt-1">Override reason: ${p.override_reason}</div>` : ''}
        ${p.earnings_snapshot ? `<div style="margin-top:6px;">${p.earnings_snapshot.map(s =>
          `<div class="flex-between" style="font-size:11px;padding:2px 0;">
            <span style="color:var(--text2);">${s.name}</span>
            <span>${formatMins(s.total_mins)} ${s.earnings!==null?'· '+fmtCurrency(s.earnings):''}</span>
          </div>`).join('')}</div>` : ''}
      </div>`;
    }).join('') || '<div class="text-xs text-muted mb-4">No frozen periods yet.</div>';

  return `
    <div class="section-head">
      <div><h2>Year End &amp; Freeze</h2><div class="sub">Admin only</div></div>
    </div>
    <div class="page-pad">

      <div class="card card-sm mb-4" style="background:var(--bg2);">
        <div class="fw-700 text-sm mb-4" style="margin-bottom:8px;">Year End Date</div>
        <div class="form-row">
          <div class="form-group" style="margin-bottom:0;">
            <label>Day</label>
            <input type="number" id="ye-day" min="1" max="31" value="${ye.day}" style="text-align:center;"/>
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label>Month</label>
            <select id="ye-month">
              ${MONTH_NAMES.map((n,i) => `<option value="${i+1}" ${ye.month===i+1?'selected':''}>${n}</option>`).join('')}
            </select>
          </div>
        </div>
        <button class="btn btn-secondary btn-full mt-4" style="margin-top:8px;" onclick="saveYearEndSettings()">Save Year End Date</button>
        <div class="text-xs text-muted mt-1">
          Last year end: ${lastYearEnd.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})} ·
          Next: ${nextYearEnd.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}
        </div>
      </div>

      ${!isLastFrozen ? `
      <div class="card card-sm mb-4" style="background:linear-gradient(135deg,#FFF4E5,#FFE8EE);border-color:var(--amber);">
        <div class="fw-700 text-sm" style="color:#A05A00;margin-bottom:6px;">⚠ Year end ${lastYearEndStr} not yet frozen</div>
        <div class="text-xs text-muted" style="margin-bottom:10px;line-height:1.7;">
          Freezing calculates and locks earnings for all staff up to this date.
          Rates cannot affect frozen calculations. You can unfreeze to correct errors.
        </div>
        <button class="btn btn-primary btn-full" onclick="freezePeriod('${lastYearEndStr}')">
          🔒 Freeze ${lastYearEndStr}
        </button>
      </div>` : ''}

      <div class="fw-700 text-xs text-muted" style="text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Frozen Periods</div>
      ${frozenList}

    </div>
    <div style="height:20px;"></div>`;
}

function renderModal() {
  if (!state.modal) return '';
  const { modal } = state;

  if (modal === 'add-user' || modal === 'edit-user') {
    const isEdit = modal === 'edit-user';
    const d = state.modalData.user || {};
    const title = isEdit ? 'Edit User' : 'Add User';
    const roleOpts = ['user','admin'].map(r =>
      `<option value="${r}" ${(d.role||'user')===r?'selected':''}>${r==='admin'?'Admin':'Staff'}</option>`
    ).join('');
    return `<div class="modal-overlay" onclick="closeModalOutside(event)">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">${title}</div>
          <button class="modal-close" onclick="closeModal()">${icons.x}</button>
        </div>
        <div class="form-group"><label>Full Name *</label><input type="text" id="u-name" value="${d.name||''}"/></div>
        <div class="form-row">
          <div class="form-group"><label>Role</label><select id="u-role">${roleOpts}</select></div>
          ${!isEdit ? `<div class="form-group"><label>PIN (4 digits)</label><input type="number" id="u-pin" maxlength="4" placeholder="e.g. 1234"/></div>` : ''}
        </div>
        <div class="form-group"><label>Phone</label><input type="tel" id="u-phone" value="${d.phone||''}"/></div>
        <div class="form-group"><label>Email</label><input type="email" id="u-email" value="${d.email||''}"/></div>
        <div class="form-group"><label>Address</label><input type="text" id="u-address" placeholder="e.g. 24 Rose Lane" value="${d.address||''}"/></div>
        <div class="form-row">
          <div class="form-group"><label>City / Town</label><input type="text" id="u-city" value="${d.city||''}"/></div>
          <div class="form-group"><label>Postcode</label><input type="text" id="u-postcode" placeholder="e.g. SW1A 1AA" value="${d.postcode||''}"/></div>
        </div>
        <button class="btn btn-primary btn-full" onclick="saveUser(${isEdit?`'${d.id}'`:''})">
          ${isEdit ? icons.edit + ' Update' : icons.plus + ' Add User'}
        </button>
      </div>
    </div>`;
  }

  if (modal === 'rates') {
    const user = state.users.find(u => u.id === state.modalData.userId);
    if (!user) return '';
    const rates = user.rates || [];
    const _today = new Date().toISOString().slice(0,10);
    const rateRows = rates.map((r, i) => {
      const isFut = r.from_date > _today;
      return `
      <div class="card card-sm mb-4" style="background:${isFut ? 'linear-gradient(135deg,#F0EBFF,#EDE6FF)' : 'var(--bg2)'};border-color:${isFut ? 'var(--violet-light)' : 'var(--border)'};">
        <div class="flex-between" style="margin-bottom:6px;">
          <div>
            <span class="fw-700 text-sm">£${parseFloat(r.hourly_rate).toFixed(2)}/hr</span>
            ${isFut ? `<span style="font-size:9px;background:#EDE6FF;color:var(--violet-dark);padding:1px 6px;border-radius:10px;margin-left:6px;font-weight:700;">FUTURE</span>` : ''}
            <div class="text-xs text-muted" style="margin-top:2px;">${r.from_date} – ${r.to_date}</div>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-secondary btn-sm btn-icon" onclick="editRate('${user.id}',${i})">${icons.edit}</button>
            <button class="btn btn-danger btn-sm btn-icon" onclick="deleteRate('${user.id}',${i})">${icons.trash}</button>
          </div>
        </div>
        ${r.note ? `<div class="text-xs text-muted">${r.note}</div>` : ''}
      </div>`;
    }).join('');

    const today = new Date().toISOString().slice(0,10);
    const futureRates  = rates.filter(r => r.from_date > today);
    const currentRates = rates.filter(r => r.from_date <= today);
    const canAdd = currentRates.length < 3 || futureRates.length < 1;
    const addForm = canAdd ? `
      <div style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px;margin:12px 0 8px;">
        ${rates.length === 0 ? 'Add First Rate' : futureRates.length === 0 ? 'Add Rate (or a future rate)' : 'Add Rate'}
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>From Date</label>
          <input type="date" id="rate-from" onchange="onRateFromChange(this.value)"/>
        </div>
        <div class="form-group">
          <label>To Date</label>
          <input type="date" id="rate-to"/>
        </div>
      </div>
      <div class="form-group">
        <label>Hourly Rate (£)</label>
        <input type="number" id="rate-amount" step="0.01" min="0.01" placeholder="e.g. 12.50"/>
      </div>
      <div class="form-group">
        <label>Note (optional)</label>
        <input type="text" id="rate-note" placeholder="e.g. April 2026 pay rise"/>
      </div>
      <div id="rate-error" style="color:var(--coral-dark);font-size:12px;min-height:16px;margin-bottom:8px;"></div>
      <button class="btn btn-primary btn-full" onclick="saveRate('${user.id}')">
        ${icons.plus} Add Rate
      </button>` : `<div class="text-xs text-muted" style="margin-top:8px;">Maximum rates reached (3 current + 1 future). Delete one to add another.</div>`;

    return `<div class="modal-overlay" onclick="closeModalOutside(event)">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">Hourly Rates — ${user.name}</div>
          <button class="modal-close" onclick="closeModal()">${icons.x}</button>
        </div>
        ${rateRows || '<div class="text-xs text-muted mb-4">No rates set yet</div>'}
        ${addForm}
      </div>
    </div>`;
  }

  if (modal === 'edit-rate') {
    const user = state.users.find(u => u.id === state.modalData.userId);
    const rateIdx = state.modalData.rateIdx;
    const rate = user && user.rates && user.rates[rateIdx];
    if (!rate) return '';
    return `<div class="modal-overlay" onclick="closeModalOutside(event)">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">Edit Rate — ${user.name}</div>
          <button class="modal-close" onclick="closeModal()">${icons.x}</button>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>From Date</label>
            <input type="date" id="edit-rate-from" value="${rate.from_date}"/>
          </div>
          <div class="form-group">
            <label>To Date</label>
            <input type="date" id="edit-rate-to" value="${rate.to_date}"/>
          </div>
        </div>
        <div class="form-group">
          <label>Hourly Rate (£)</label>
          <input type="number" id="edit-rate-amount" step="0.01" min="0.01" value="${rate.hourly_rate}"/>
        </div>
        <div class="form-group">
          <label>Note (optional)</label>
          <input type="text" id="edit-rate-note" value="${rate.note||''}"/>
        </div>
        <div id="edit-rate-error" style="color:var(--coral-dark);font-size:12px;min-height:16px;margin-bottom:8px;"></div>
        <button class="btn btn-primary btn-full" onclick="updateRate('${user.id}',${rateIdx})">
          ${icons.edit} Update Rate
        </button>
      </div>
    </div>`;
  }

  if (modal === 'change-pin') {
    const d = state.modalData;
    return `<div class="modal-overlay" onclick="closeModalOutside(event)">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">Change PIN</div>
          <button class="modal-close" onclick="closeModal()">${icons.x}</button>
        </div>
        <div class="form-group">
          <label>Current PIN</label>
          <input type="password" id="pin-old" maxlength="4" inputmode="numeric" placeholder="••••"/>
        </div>
        <div class="form-group">
          <label>New PIN</label>
          <input type="password" id="pin-new" maxlength="4" inputmode="numeric" placeholder="••••"/>
        </div>
        <div class="form-group">
          <label>Confirm New PIN</label>
          <input type="password" id="pin-confirm" maxlength="4" inputmode="numeric" placeholder="••••"/>
        </div>
        <div id="pin-change-error" style="color:var(--coral-dark);font-size:13px;min-height:18px;margin-bottom:10px;"></div>
        <button class="btn btn-primary btn-full" onclick="doChangePin()">
          ${icons.key} Change PIN
        </button>
      </div>
    </div>`;
  }

  if (modal === 'admin-reset-pin') {
    const uid = state.modalData.targetUserId;
    const user = state.users.find(u => u.id === uid);
    return `<div class="modal-overlay" onclick="closeModalOutside(event)">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">Reset PIN</div>
          <button class="modal-close" onclick="closeModal()">${icons.x}</button>
        </div>
        <p style="font-size:14px;color:var(--text2);margin-bottom:16px;">Set a new PIN for <strong>${user?.name}</strong></p>
        <div class="form-group">
          <label>New PIN (4 digits)</label>
          <input type="number" id="new-pin-reset" maxlength="4" inputmode="numeric" placeholder="e.g. 9876"/>
        </div>
        <div id="reset-pin-error" style="color:var(--coral-dark);font-size:13px;min-height:18px;margin-bottom:10px;"></div>
        <button class="btn btn-primary btn-full" onclick="doAdminResetPin('${uid}')">
          ${icons.key} Set New PIN
        </button>
      </div>
    </div>`;
  }

  return '';
}

window.nav = (screen) => {
  state.screen = screen;
  state.profileMenu = false;
  if (screen === 'log') state.modalData = {};
  render();
  _tsUpdateFab(screen);
};

function _tsUpdateFab(screen) {
  const fab = document.getElementById('fab');
  const backFab = document.getElementById('back-fab');
  // FAB: show on home and entries, hide on log screen (it IS the log) and config screens
  const fabScreens = ['home', 'entries'];
  const noFabScreens = ['log', 'pin'];
  if (fab) fab.classList.toggle('hidden', noFabScreens.includes(screen));
  // Back FAB: show on all screens except home
  if (backFab) backFab.classList.toggle('visible', screen !== 'home' && !!state.currentUser);
}

window.pinKey = (key) => {
  if (key === 'del') {
    state.pinInput = state.pinInput.slice(0, -1);
    state.pinError = '';
  } else if (state.pinInput.length < 4) {
    state.pinInput += key;
    if (state.pinInput.length === 4) {
      setTimeout(() => {
        tryLogin(state.pinInput);
      }, 120);
    }
  }
  render();
};

window.toggleProfileMenu = () => {
  state.profileMenu = !state.profileMenu;
  render();
};

window.openChangePinModal = () => {
  state.profileMenu = false;
  state.modal = 'change-pin';
  render();
};

window.closeModal = () => {
  state.modal = null;
  state.modalData = {};
  render();
};

window.closeModalOutside = (e) => {
  if (e.target.classList.contains('modal-overlay')) closeModal();
};

window.updateShift = (idx, field, val) => {
  const entry = state.modalData.editEntry || { date: todayStr(), shifts: [{start:'',end:''}], note:'' };
  if (!entry.shifts[idx]) entry.shifts[idx] = {start:'',end:''};
  entry.shifts[idx][field] = val;
  state.modalData.editEntry = entry;
  render();
};

window.addShift = () => {
  const entry = state.modalData.editEntry || { date: todayStr(), shifts: [{start:'',end:''}], note:'' };
  if (entry.shifts.length < 3) entry.shifts.push({start:'',end:''});
  state.modalData.editEntry = entry;
  render();
};

window.removeShift = (idx) => {
  const entry = state.modalData.editEntry || { date: todayStr(), shifts: [{start:'',end:''}], note:'' };
  entry.shifts.splice(idx, 1);
  state.modalData.editEntry = entry;
  render();
};

window.updateLogDate = (val) => {
  const entry = state.modalData.editEntry || { date: todayStr(), shifts: [{start:'',end:''}], note:'' };
  entry.date = val;
  state.modalData.editEntry = entry;
};

window.saveEntry = async () => {
  const dateEl = document.getElementById('log-date');
  const noteEl = document.getElementById('log-note');
  const entry = state.modalData.editEntry || { shifts: [{start:'',end:''}] };
  const date = dateEl ? dateEl.value : entry.date || todayStr();
  const note = noteEl ? noteEl.value : entry.note || '';

  const shifts = entry.shifts || [{start:'',end:''}];
  const validShifts = shifts.filter(s => s.start && s.end);
  if (validShifts.length === 0) { showToast('Add at least one complete shift'); return; }

  const total = validShifts.reduce((a, s) => a + roundShift(parseTime(s.start), parseTime(s.end)), 0);

  if (entry.id) {
    const updated = { ...entry, date, shifts: validShifts, total_mins: total, note };
    const idx = state.entries.findIndex(e => e.id === entry.id);
    if (idx >= 0) state.entries[idx] = updated;
    if (!DEMO_MODE && db) {
      try {
        await fbSetDoc(fbDoc(db, 'entries', entry.id), updated);
        console.log('Entry updated in Firestore:', entry.id);
      } catch(e) { console.error('Entry update failed:', e); showToast('Save failed: ' + e.message); return; }
    }
    showToast('Entry updated');
  } else {
    const id = Date.now().toString();
    const newEntry = { id, user_id: state.currentUser.id, date, shifts: validShifts, total_mins: total, note };
    state.entries.push(newEntry);
    if (!DEMO_MODE && db) {
      try {
        await fbSetDoc(fbDoc(db, 'entries', id), newEntry);
        console.log('Entry saved to Firestore:', id);
      } catch(e) { console.error('Entry save failed:', e); showToast('Save failed: ' + e.message); return; }
    }
    auditLog('ENTRY_ADD', `Shift logged for ${date}: ${validShifts.map(s=>s.start+'-'+s.end).join(', ')} = ${formatMins(total)}`);
    showToast('Entry saved');
  }
  state.modalData = {};
  state.screen = 'entries';
  render();
};

window.editEntry = (id) => {
  const entry = state.entries.find(e => e.id === id);
  if (!entry) return;
  state.modalData.editEntry = JSON.parse(JSON.stringify(entry));
  state.screen = 'log';
  render();
};

window.deleteEntry = async (id) => {
  if (!confirm('Delete this entry?')) return;
  const delEntry = state.entries.find(e => e.id === id);
  if (delEntry) auditLog('ENTRY_DELETE', `Entry deleted for ${delEntry.date}`);
  state.entries = state.entries.filter(e => e.id !== id);
  state.modalData = {};
  state.screen = 'entries';
  if (!DEMO_MODE && db) {
    try {
      await fbDeleteDoc(fbDoc(db, 'entries', id));
      console.log('Entry deleted from Firestore:', id);
    } catch(e) { console.error('Entry delete failed:', e); showToast('Delete failed: ' + e.message); return; }
  }
  showToast('Entry deleted');
  render();
};

window.setEntriesMonth = (m, y) => {
  state.entriesMonth = m;
  state.entriesYear = y;
  render();
};

window.setReportTab = (tab) => { state.reportTab = tab; render(); };

// ── Report overlay (on-screen first, then print) ──
window.showReportOverlay = function(title, bodyHtml) {
  const overlay = document.getElementById('report-overlay');
  const titleEl = document.getElementById('report-title');
  const bodyEl  = document.getElementById('report-body');
  if (!overlay || !titleEl || !bodyEl) return;
  titleEl.textContent = title;
  bodyEl.innerHTML = bodyHtml;
  overlay.style.display = 'flex';
};

window.closeReportOverlay = function() {
  const overlay = document.getElementById('report-overlay');
  if (overlay) overlay.style.display = 'none';
};

window.printCurrentReport = function() {
  const titleEl = document.getElementById('report-title');
  const bodyEl  = document.getElementById('report-body');
  const overlay = document.getElementById('print-overlay');
  const content = document.getElementById('print-content');
  if (!overlay || !content || !bodyEl) return;
  const title = titleEl ? titleEl.textContent : 'TimeShift Report';
  const now = new Date().toLocaleDateString('en-GB', {day:'numeric',month:'long',year:'numeric'});
  content.innerHTML = `
    <div style="border-bottom:2px solid #7C5CBF;padding-bottom:8px;margin-bottom:12px;">
      <h2 style="color:#7C5CBF;font-size:16pt;margin:0 0 2px;">${title}</h2>
      <p style="color:#888;font-size:9pt;margin:0;">TimeShift · Printed ${now}</p>
    </div>
    ${bodyEl.innerHTML}`;
  closeReportOverlay();
  overlay.style.display = 'block';
  overlay.scrollTop = 0;
};

window.closePrintOverlay = function() {
  const overlay = document.getElementById('print-overlay');
  if (overlay) overlay.style.display = 'none';
};
window.setReportViewMode = (mode) => { state.reportViewMode = mode; render(); };

// Drill from year into a specific month (shows week totals)
window.drillMonth = (m, y) => {
  state.reportTab = 'month';
  state.reportMonth = m;
  state.reportYear = y;
  render();
};

// Drill from month into a specific week (shows day totals in overlay)
window.drillWeek = (weekStartStr) => {
  const weekStart = parseDate(weekStartStr);
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);
  const u = state.currentUser;
  const entries = state.entries.filter(e => {
    if (e.user_id !== u.id) return false;
    const d = parseDate(e.date);
    return d >= weekStart && d <= weekEnd;
  }).sort((a,b) => a.date.localeCompare(b.date));
  const total = sumMins(entries);
  const wkLabel = `${weekStart.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${weekEnd.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}`;
  const ep = calcPeriodEarnings(entries, u);

  const bodyHtml = `
    <div class="card card-sm mb-4" style="background:linear-gradient(135deg,#E0F7FA,#E8F5E9);">
      <div class="flex-between">
        <span class="fw-700" style="color:#00696F;">Week Total</span>
        <span class="fw-800 text-violet" style="font-size:14px;">${formatMins(total)}</span>
      </div>
      ${ep.hasRates?`<div class="text-xs" style="color:#1A7A42;font-weight:700;margin-top:2px;">Earnings: ${fmtCurrency(ep.total)}</div>`:''}
    </div>
    ${entries.map(e => {
      const rate = getRateForDate(u, e.date);
      const earn = rate ? fmtCurrency(calcEarnings(e.total_mins, rate)) : '';
      return `<div class="entry-item" style="cursor:default;margin-bottom:6px;">
        <div class="flex-between">
          <div>
            <div class="fw-700 text-sm">${displayDate(e.date)}</div>
            <div class="text-xs text-muted">${e.shifts.map(s=>s.start+'–'+s.end).join(' · ')}</div>
            ${e.note?`<div class="text-xs text-muted">${e.note}</div>`:''}
          </div>
          <div style="text-align:right;">
            <div class="fw-800 text-coral">${formatMins(e.total_mins)}</div>
            ${earn?`<div class="text-xs" style="color:#1A7A42;font-weight:700;">${earn}</div>`:''}
          </div>
        </div>
      </div>`;
    }).join('')}`;

  showReportOverlay(`Week ${wkLabel} — ${u.name}`, bodyHtml);
};

// Tap a day to see full shift detail in overlay
window.showDayDetail = (entryId) => {
  const u = state.currentUser;
  const e = state.entries.find(x => x.id === entryId);
  if (!e) return;
  const rate = getRateForDate(u, e.date);
  const earn = rate ? fmtCurrency(calcEarnings(e.total_mins, rate)) : null;
  const bodyHtml = `
    <div class="fw-700 text-sm mb-4" style="margin-bottom:8px;">${displayDate(e.date)}</div>
    ${e.shifts.map((s,i) => `<div class="card card-sm mb-4" style="background:var(--bg2);margin-bottom:6px;">
      <div class="flex-between">

window.toggleAdminUser = (uid, checked) => {
  // Update state array directly — checkbox handles its own visual state
  if (checked) {
    if (!state.adminSelectedUsers.includes(uid)) state.adminSelectedUsers.push(uid);
  } else {
    state.adminSelectedUsers = state.adminSelectedUsers.filter(id => id !== uid);
  }
  // Update count badge only — no full re-render needed
  const badge = document.getElementById('admin-sel-count');
  if (badge) {
    const count = state.adminSelectedUsers.length === 0
      ? state.users.filter(u => u.active).length
      : state.adminSelectedUsers.length;
    badge.textContent = count + ' selected';
  }
};

window.selectAllAdminUsers = (all) => {
  const allUsers = state.users.filter(u => u.active);
  state.adminSelectedUsers = all ? allUsers.map(u => u.id) : [];
  // Sync checkboxes visually without full render
  document.querySelectorAll('.admin-user-cb').forEach(cb => { cb.checked = all; });

  if (badge) badge.textContent = (all ? allUsers.length : 0) + ' selected';

function getAdminSelected() {
  const allActive = state.users.filter(u => u.active);
  return state.adminSelectedUsers.length > 0
    ? allActive.filter(u => state.adminSelectedUsers.includes(u.id))
    : allActive;
}

// Apply — reads current checkbox states from DOM then re-renders report
window.applyAdminReport = () => {
  const allUsers = state.users.filter(u => u.active);
  const checked = [];
  document.querySelectorAll('.admin-user-cb').forEach(cb => {
    if (cb.checked) checked.push(cb.value);
  });
  // If DOM had no checkboxes (already re-rendered), fall back to state
  state.adminSelectedUsers = checked.length > 0 ? checked
    : state.adminSelectedUsers.length > 0 ? state.adminSelectedUsers
    : allUsers.map(u => u.id);
  render();
};
